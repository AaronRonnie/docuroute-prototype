async function handleSubmitRequest(){
  // Staff capturing a walk-in (mobile field intake) picks the document type
  // directly (#fType) -- it used to be an office picker translated through
  // OFFICE_TO_TYPE, but that only worked while each office was the first hop
  // of exactly one type. Once crediting/shift_program also start at Dean's
  // Office (alongside waiver), that 1:1 mapping broke, so staff now name the
  // type directly and the route is just ROUTES[type]. A student submitting
  // online never does either — see finishPipeline() for how a student's type
  // gets resolved (by the real classifier, or randomType() as a last-resort
  // simulated guess if it's unreachable).
  const typeSel = document.getElementById("fType");
  const isStaffCapture = !!typeSel;
  const type = isStaffCapture ? typeSel.value : null;
  const student = document.getElementById("fName").value || "Unnamed Student";
  const studentNo = document.getElementById("fStudentNo").value || "—";
  const program = document.getElementById("fProgram").value || "—";
  const contactNo = document.getElementById("fContact").value || "—";
  const fields = {};
  if(isStaffCapture){
    if(type==="waiver"){ fields.quarterAY=val("tQuarter"); fields.prereq=val("tPrereq"); fields.advanced=val("tAdvanced"); }
    if(type==="adjustment"){ fields.currentSection=val("tCurrent"); fields.newSection=val("tNew"); fields.subject=val("tSubject"); }
    if(type==="clearance"){ fields.reason=val("tReason"); }
    if(type==="course_completion"){ fields.subject=val("tCcSubject"); fields.deadline=val("tCcDeadline"); fields.task=val("tCcTask"); }
    if(type==="crediting"){ fields.priorSchool=val("tCrSchool"); fields.entrantType=val("tCrEntrant"); fields.courses=val("tCrCourses"); }
    if(type==="shift_program"){ fields.currentProgram=val("tSpCurrent"); fields.newProgram=val("tSpNew"); }
  } else {
    fields.details = val("tDetails") || "";
  }
  const fileInput = document.getElementById("fFile");
  const file = fileInput && fileInput.files[0];

  // A student submission with neither a file nor a description has nothing
  // for the AI Processing Layer to actually read -- letting it through used
  // to still call the classifier (which correctly errored on empty input)
  // and then fall back to a random simulated type/confidence, sometimes
  // clearing the 70% gate and "routing" a request with no document behind
  // it at all. Staff capture always has a real photo (its file input isn't
  // optional in mobileCaptureHtml), so this only applies to students.
  if(!isStaffCapture && !file && !fields.details.trim()){
    const hint = document.getElementById("newReqHint");
    if(hint){ hint.textContent = "Please provide a photo or request details."; hint.classList.add("error"); document.getElementById("dropzone")?.focus(); }
    else showToast("Attach a photo of your form, or describe your request, before submitting.", "warn");
    return;
  }

  closeModal();
  try{
    const { data: id, error: idErr } = await sb.rpc("next_request_id");
    if(idErr) throw new ApiError(idErr.message);
    // A student submits their own request (student_id = them); staff capturing a
    // walk-in's paper form on mobile has no portal account to link it to.
    const studentIdForRow = session.role === "student" ? session.id : null;
    const { error: insErr } = await sb.from("requests").insert({
      id, type, student_id: studentIdForRow, student_name: student, student_no: studentNo,
      program, contact_no: contactNo, fields, confidence: null, route: ROUTES[type] || [], hop: 0, status: "submitted"
    });
    if(insErr) throw new ApiError(insErr.message);
    await addLog(id, `Submitted by ${student} - document uploaded to DocuRoute.`);
    if(file){
      const path = `${id}/${file.name}`;
      const { error: upErr } = await sb.storage.from("documents").upload(path, file, { upsert:true });
      if(!upErr) await sb.from("requests").update({ document_path: path }).eq("id", id);
    }
    await refresh();
    // Staff already told us the type directly (#fType above) -- re-classifying
    // on top of an explicit human decision would just be confusing, so only
    // student (blind) submissions get run through
    // the real/simulated classifier.
    runAiPipeline(id, { file, text: fields.details, skipClassification: isStaffCapture });
  }catch(e){ showToast("Couldn't submit: " + (e.message || "can't reach the server."), "bad"); renderRoot(); }
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }

/* ---------------- AI pipeline animation ---------------- */

function runAiPipeline(id, ctx){
  ctx = ctx || {};
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="progress-modal">
      <div class="spinner"></div>
      <div class="stage" id="stageTxt">Rectifying image…</div>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  const stages = ["Rectifying image (deskew · crop · contrast)…","Running OCR text extraction…","Layout-aware multimodal classification…","Applying confidence gate…"];
  let i = 0;
  const stageEl = document.getElementById("stageTxt");
  const timer = setInterval(()=>{
    i++;
    if(i < stages.length){ stageEl.textContent = stages[i]; return; }
    clearInterval(timer);
    finishPipeline(id, ctx);
  }, 550);
}
async function finishPipeline(id, ctx){
  ctx = ctx || {};
  let outcome = null; // what the student's result screen shows
  try{
    // Nothing to actually classify -- handleSubmitRequest already blocks this
    // for a fresh submission, but this stays as a backstop: don't fake a
    // classifier decision (real or simulated) over empty input.
    const noInput = !ctx.skipClassification && !ctx.file && !(ctx.text && ctx.text.trim());
    let type = null, confidence = null, usedRealClassifier = false;
    if(!ctx.skipClassification && !noInput){
      const result = await callClassifyApi({ file: ctx.file, text: ctx.text });
      if(result){ type = result.type; confidence = result.confidence; usedRealClassifier = true; }
    }
    if(confidence === null){
      if(noInput){
        confidence = 0;
      } else {
        // Real classifier unreachable/skipped -- simulate as before. Staff
        // capture already declared its type at submission (#fType) and is
        // untouched here; a student submission with no reachable real
        // classifier gets the same random guess it always did, just made now
        // (at classification time) instead of at insert time, so a real
        // classifier that *does* respond a moment later always wins instead of
        // this guess silently sticking forever (the original bug).
        confidence = Math.floor(55 + Math.random()*44);
        if(!ctx.skipClassification) type = randomType();
      }
    }
    // Staff capture already has a valid type/route from insert (this
    // function never re-derives it), so gate on confidence alone for that
    // path. A student submission needs both a resolved type AND >=70%
    // confidence to auto-route -- an explicit "not one of our 3 types"
    // result (type stays null) or a below-gate confidence both fall to
    // manual review instead of silently routing nowhere useful.
    const status = ctx.skipClassification
      ? (confidence < 70 ? "unverified" : "routed")
      : (type && ROUTES[type] && confidence >= 70 ? "routed" : "unverified");
    const update = { confidence, status };
    if(!ctx.skipClassification && status === "routed"){ update.type = type; update.route = ROUTES[type]; }

    // Atomic claim: only apply this result if the row is STILL "submitted".
    // Without this, two tabs racing the recovery sweep for the same
    // abandoned request (e.g. the same account open in multiple
    // tabs/windows, each polling independently) could both run
    // classification and both write -- the second one landing after the
    // first, silently clobbering a correct result with a stale or
    // contradictory one, and leaving duplicate/confusing audit log entries
    // behind either way. .eq("status","submitted") makes this a
    // compare-and-swap: whichever attempt's write reaches the database
    // first wins, and .select("id") tells us here whether ours did.
    const { data: claimed, error: claimErr } = await sb.from("requests")
      .update(update).eq("id", id).eq("status", "submitted").select("id");
    if(claimErr) throw claimErr;
    if(!claimed || claimed.length === 0){
      // Someone else already resolved this request -- nothing to log, our
      // classification result (if any) is simply discarded.
      await refresh();
      if(!ctx.silent) renderRoot();
      return;
    }

    outcome = { id, type, confidence, status, noInput };
    await addLog(id, noInput
      ? "AI Processing Layer: no file or description was attached - nothing to classify. Needs manual classification."
      : usedRealClassifier
        ? (type
            ? `AI Processing Layer: OCR extracted, classified as ${TYPE_LABEL[type] || type} by the local classify service.`
            : `AI Processing Layer: OCR extracted, but the local classify service did not recognize this as one of our 3 document types (best match ${confidence}%) - needs manual classification.`)
        : "AI Processing Layer: image rectified, OCR extracted, layout-aware classification run (simulated -- local classify service unreachable or not applicable).");
    await addLog(id, status !== "routed"
      ? `Confidence ${confidence}% is below the 70% threshold - flagged 'Unverified' and sent to the intake clerk queue.`
      : `Confidence ${confidence}% - deterministic routing table assigned this request. QR sticker printed, digital twin archived.`);
  }catch(e){
    // Whatever failed (a rejected write, a missing DB migration, etc.),
    // don't leave the request silently stuck at "Submitted"/"AI Processing
    // Layer" forever with zero explanation -- that was a real bug: a
    // classify result naming a type the live database's CHECK constraint
    // didn't allow yet (e.g. a new type added before its migration was run)
    // threw here, and this catch block used to just swallow it. Fall back
    // to manual review, the same safety net as a low-confidence result, and
    // log why so it's actually diagnosable next time.
    try{
      await addLog(id, `AI Processing Layer: could not save the classification result (${(e && e.message) || "unknown error"}) - needs manual classification.`);
      await sb.from("requests").update({ confidence:0, status:"unverified" }).eq("id", id).eq("status","submitted");
    }catch(e2){ /* nothing more we can do from here */ }
    outcome = { id, type:null, confidence:0, status:"unverified", noInput:false };
  }
  await refresh();
  // A recovery sweep (recoverStuckSubmission) can call this for a request
  // nobody's actively looking at -- don't yank the current user into a
  // detail modal for someone else's resolved submission.
  if(ctx.silent){ if(!userIsBusy()) renderRoot(); return; }
  closeModal();
  // Student: show the AI result / AI unsure page. Staff capture keeps the detail modal.
  if(session && session.role === "student" && outcome){
    state.newReq = false; state.detailId = null; state.result = outcome;
    renderRoot(); window.scrollTo(0, 0); return;
  }
  renderRoot();
  openDetail(id);
}

/* ---------------- Staff / Dean actions ---------------- */

// These used to swallow errors silently (catch(e){}); a failed write now shows
// a toast, and a successful one confirms what happened.
// The AI's best guess for an unclassified request only survives in the audit
// log ("... classified as <Label> by ..."), so read it back for pre-selecting.
function guessedTypeFromLog(req){
  for(const l of [...req.log].reverse()){
    const m = l.text.match(/classified as (.+?) by the local classify service/);
    if(m){ const key = Object.keys(TYPE_LABEL).find(k => TYPE_LABEL[k] === m[1]); if(key) return key; }
  }
  return null;
}

async function confirmAndRoute(id){
  try{
    const req = state.requests.find(r=>r.id===id);
    let update = { status:"routed" }, routeTo = req.route[0], logText;
    // An unclassified request (AI unsure) has no type and no route yet, so
    // confirming means choosing the type — that sets the route from the table.
    if(!req.type || !req.route.length){
      const guess = guessedTypeFromLog(req);
      const { ok, value } = await confirmDialog({
        title:`Confirm document type for ${id}`,
        body: guess ? `The AI suggested <b>${TYPE_LABEL[guess]}</b> at ${req.confidence}% — below the 70% gate, so please check the form.` : "The AI couldn't identify this form. Choose what it is.",
        select:{ label:"Document type", value: guess || "waiver",
                 options:Object.keys(ROUTES).map(k => ({ value:k, label:TYPE_LABEL[k] })),
                 note:"The route is set automatically from the type." },
        confirmLabel:"Confirm & route"
      });
      if(!ok) return;
      update = { status:"routed", type:value, route:ROUTES[value], hop:0 };
      routeTo = ROUTES[value][0];
      logText = `Intake clerk confirmed the document type as ${TYPE_LABEL[value]} - routed to ${routeTo}.`;
    } else {
      logText = `Intake clerk manually confirmed the document type - routed to ${routeTo}.`;
    }
    await addLog(id, logText);
    const { error } = await sb.from("requests").update(update).eq("id", id);
    if(error) throw error;
    await refresh();
    showToast(`${id} confirmed — routed to ${routeTo}.`, "good");
  }catch(e){ showToast("Couldn't route " + id + ": " + (e.message || "can't reach the server."), "bad"); }
  renderRoot();
}
async function advanceRequest(id){
  try{
    const req = state.requests.find(r=>r.id===id);
    let update, done;
    if(req.status === "routed"){
      await addLog(id, `${req.route[req.hop]} marked the request In Progress.`);
      update = { status:"progress" }; done = `${id} marked in progress.`;
    } else if(req.hop < req.route.length - 1){
      await addLog(id, `${req.route[req.hop]} cleared the request - forwarded to ${req.route[req.hop+1]}.`);
      update = { status:"routed", hop: req.hop+1 }; done = `${id} cleared — sent to ${req.route[req.hop+1]}.`;
    } else {
      await addLog(id, `${req.route[req.hop]} gave final approval. Audit trail closed.`);
      update = { status:"completed" }; done = `${id} approved — request completed.`;
    }
    const { error } = await sb.from("requests").update(update).eq("id", id);
    if(error) throw error;
    await refresh();
    showToast(done, "good");
  }catch(e){ showToast("Couldn't update " + id + ": " + (e.message || "can't reach the server."), "bad"); }
  renderRoot();
}
async function declineRequest(id){
  const { ok, reason } = await confirmDialog({
    title:`Decline ${id}?`,
    body:"The request closes at this office and the student is told why.",
    confirmLabel:"Decline request", danger:true,
    reason:{ label:"Reason for declining", placeholder:"e.g. Incomplete requirements attached." }
  });
  if(!ok) return;
  try{
    const req = state.requests.find(r=>r.id===id);
    await addLog(id, `${req.route[req.hop]} declined the request - reason: '${reason}'.`);
    const { error } = await sb.from("requests").update({ status:"declined" }).eq("id", id);
    if(error) throw error;
    await refresh();
    showToast(`${id} declined.`, "info");
  }catch(e){ showToast("Couldn't decline " + id + ": " + (e.message || "can't reach the server."), "bad"); }
  renderRoot();
}

/* ---------------- Detail modal + QR ---------------- */

function routeListHtml(req){
  return `<div class="route-list">${req.route.map((office,i)=>{
    let dotClass = "", tag = "Next", tagClass = "";
    if(req.status==="completed"){ dotClass="done"; tag="Done"; tagClass="done"; }
    else if(i < req.hop){ dotClass="done"; tag="Done"; tagClass="done"; }
    else if(i === req.hop){
      if(req.status==="declined"){ dotClass="bad"; tag="Declined"; }
      else { dotClass="current"; tag="Current"; tagClass="current"; }
    }
    const cap = i < req.hop ? "Cleared this office."
              : (i === req.hop ? (req.status==="declined" ? "Declined at this office." : "Awaiting action at this office.")
              : "Awaiting arrival.");
    return `
      <div class="route-item">
        <div class="route-dot ${dotClass}"></div>
        <div class="route-body">
          <div>
            <div class="route-name">${office}</div>
            <div class="route-cap">${cap}</div>
          </div>
          <div class="route-tag ${tagClass}">${tag}</div>
        </div>
      </div>`;
  }).join("")}</div>`;
}

function openDetail(id){
  // Students get the full-page detail (Figma 9:200 / 9:240); staff keep the modal for now.
  if(session && session.role === "student"){
    state.detailId = id; renderRoot(); window.scrollTo(0, 0); return;
  }
  const req = state.requests.find(r=>r.id===id);
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="modal-head">
      <h2>${reqTitle(req)} <span class="mono" style="font-size:13px;color:var(--ink-faint)">${req.id}</span></h2>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <div>${pill(req.status)} <span style="margin-left:10px;font-size:13px;color:var(--ink-soft)">Currently at: <b>${currentOfficeLabel(req)}</b></span></div>

      <div class="kv-card">
        <div class="kv-row"><span class="k">Student</span><span class="v">${req.student}</span></div>
        <div class="kv-row"><span class="k">Student No.</span><span class="v mono">${req.studentNo}</span></div>
        <div class="kv-row"><span class="k">Program</span><span class="v">${req.program}</span></div>
        <div class="kv-row"><span class="k">Current Office</span><span class="v">${currentOfficeLabel(req)}</span></div>
      </div>

      ${req.confidence!==null ? `
        <div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft)"><span>Classification confidence</span><span class="mono">${req.confidence}%</span></div>
          <div class="conf-bar"><div style="width:${req.confidence}%; background:${req.confidence<70?'var(--bad)':'var(--good)'}"></div></div>
        </div>` : ""}

      <div>
        <div class="panel-title">Paper Route</div>
        ${routeListHtml(req)}
      </div>

      <div class="qr-wrap">
        <div id="qrHolder"></div>
        <div style="font-size:13px;color:var(--ink-soft)">Scan to link this physical form to its digital-twin record.<br><span class="mono" style="font-size:11.5px">${req.id}</span></div>
      </div>

      ${req.documentPath ? `<div><button class="btn secondary small" id="viewDocBtn">View attached form</button></div>` : ""}

      <div>
        <div class="panel-title">Audit Trail</div>
        <div class="timeline">
          ${req.log.map(l=>`
            <div class="tl-item">
              <div class="tl-dot-col"><div class="tl-dot"></div><div class="tl-line"></div></div>
              <div class="tl-body"><div class="txt">${esc(l.text)}</div><div class="ts">${fmtTs(l.ts)}</div></div>
            </div>`).join("")}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>Close</button>
    </div>
  `;
  document.getElementById("overlay").classList.add("open");
  try{
    new QRCode(document.getElementById("qrHolder"), { text: req.id, width:84, height:84, colorDark:"#20241F", colorLight:"#ffffff" });
  }catch(e){ document.getElementById("qrHolder").textContent = req.id; }
  const viewDocBtn = document.getElementById("viewDocBtn");
  if(viewDocBtn) viewDocBtn.addEventListener("click", async ()=>{
    const { data, error } = await sb.storage.from("documents").createSignedUrl(req.documentPath, 60);
    if(!error && data && data.signedUrl) window.open(data.signedUrl, "_blank");
    else showToast("Couldn't open the attached form. Try again in a moment.", "bad");
  });
}

/* ---------------- Wiring ---------------- */

function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("modal").innerHTML = "";
}
function wireViewEvents(){ wireCommonActions(); }

function wireCommonActions(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=> openDetail(el.dataset.open));
  });
  document.querySelectorAll("[data-confirm]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); confirmAndRoute(el.dataset.confirm); });
  });
  document.querySelectorAll("[data-advance]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); advanceRequest(el.dataset.advance); });
  });
  document.querySelectorAll("[data-decline]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); declineRequest(el.dataset.decline); });
  });
  const newBtn = document.getElementById("newReqBtn");
  if(newBtn) newBtn.addEventListener("click", openNewRequestModal);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", async ()=>{
    const { ok } = await confirmDialog({
      title:"Reset demo requests?",
      body:"This clears every request in the shared Supabase project and re-seeds the four demo requests. Accounts are kept.",
      confirmLabel:"Reset", danger:true
    });
    if(!ok) return;
    try{ await resetDemoRequests(); await refresh(); showToast("Demo requests reset.", "good"); }
    catch(e){ showToast("Couldn't reset: " + (e.message || "can't reach the server."), "bad"); }
    renderRoot();
  });
  const newAcctBtn = document.getElementById("newAcctBtn");
  if(newAcctBtn) newAcctBtn.addEventListener("click", ()=> openAccountModal(null));
  document.querySelectorAll("[data-edit-acct]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const acct = state.accounts.find(a=>a.id===el.dataset.editAcct);
      openAccountModal(acct);
    });
  });
  document.querySelectorAll("[data-delete-acct]").forEach(el=>{
    el.addEventListener("click", ()=> deleteAccount(el.dataset.deleteAcct));
  });
}

document.getElementById("overlay").addEventListener("click", (e)=>{
  if(e.target.id==="overlay" || e.target.closest("[data-close]")) closeModal();
});

async function init(){
  applyViewportTheme();
  MOBILE_QUERY.addEventListener("change", ()=>{ stopQrScanner(); applyViewportTheme(); renderRoot(); });
  if(!SUPABASE_CONFIGURED){ renderRoot(); return; }
  // All tabs of one browser share a single login. If another tab signs in as a
  // different account (or signs out), this tab must not keep acting as the old
  // one — its writes would silently run as the new account. Reload to match.
  sb.auth.onAuthStateChange((event, s)=>{
    if(!session) return; // this tab isn't logged in (or is mid-login): nothing to protect
    const changed = event === "SIGNED_OUT" || (s && s.user && s.user.id !== session.id);
    if(!changed) return;
    showToast("Your login changed in another tab — reloading as that account.", "warn", { timeout:0 });
    setTimeout(()=> location.reload(), 1200);
  });
  await loadSession();
  if(session){
    state.page = pagesForSession(session)[0].id;
    try{
      await refresh();
      if(session.role === "admin") await refreshAccounts();
    }catch(e){ apiOnline = false; }
  }
  renderRoot();
}
init();
</script>
