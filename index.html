<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuRoute Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#ECE8DD; --surface-3:#E1DDCF;
    --ink:#20241F; --ink-soft:#5B6058; --ink-faint:#8B9088;
    --accent:#181B16; --accent-strong:#000000; --btn-ink:#FFFFFF;
    --brand:#1F3D2E; --brand-strong:#122318;
    --good:#1F7A4D; --good-soft:#E1F2E7;
    --current:#B5541F; --current-soft:#F6E6DA;
    --bad:#C0392B; --bad-soft:#FBE3E1;
    --line:#E4E1D5;
    --shadow:0 1px 2px rgba(32,36,31,.05), 0 10px 26px -14px rgba(32,36,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14160F; --surface:#1B1E16; --surface-2:#242820; --surface-3:#2C3127;
      --ink:#EDEBE2; --ink-soft:#B3B2A6; --ink-faint:#82877C;
      --accent:#ECE8DD; --accent-strong:#FFFFFF; --btn-ink:#14160F;
      --brand:#3FAF7B; --brand-strong:#6FCE9C;
      --good:#5FBF8E; --good-soft:#1B2F22;
      --current:#E08A4D; --current-soft:#3A2416;
      --bad:#E5766B; --bad-soft:#3A201D;
      --line:#31352A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14160F; --surface:#1B1E16; --surface-2:#242820; --surface-3:#2C3127;
    --ink:#EDEBE2; --ink-soft:#B3B2A6; --ink-faint:#82877C;
    --accent:#ECE8DD; --accent-strong:#FFFFFF; --btn-ink:#14160F;
    --brand:#3FAF7B; --brand-strong:#6FCE9C;
    --good:#5FBF8E; --good-soft:#1B2F22;
    --current:#E08A4D; --current-soft:#3A2416;
    --bad:#E5766B; --bad-soft:#3A201D;
    --line:#31352A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:"Lora", ui-serif, Georgia, serif; font-weight:600; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  button{ font:inherit; cursor:pointer; }
  a{ color:inherit; }

  /* ---- App shell: sidebar + content ---- */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  .sidebar{
    width:236px; flex:0 0 236px; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:22px 20px; border-bottom:1px solid var(--line); }
  .brand-mark{
    width:32px; height:32px; border-radius:8px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:"Lora",serif; font-weight:700; font-size:17px; flex:0 0 auto;
  }
  .brand-word{ font-family:"Lora",serif; font-weight:700; font-size:19px; color:var(--ink); }
  .nav-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); font-weight:600; padding:16px 12px 8px; }
  .sidebar-nav{ padding:0 12px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border-radius:9px; font-size:14px; color:var(--ink-soft);
    background:none; border:none; margin-bottom:2px;
  }
  .nav-item svg{ width:17px; height:17px; flex:0 0 auto; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--surface-2); color:var(--ink); font-weight:600; }
  .sidebar-spacer{ flex:1; }
  .conn-row{ display:flex; align-items:center; gap:8px; padding:0 20px 10px; font-size:11px; color:var(--ink-faint); }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:0 0 auto; }
  .conn-dot.off{ background:var(--bad); }
  .reset-link{ background:none; border:none; color:var(--ink-faint); font-size:11.5px; padding:0 20px 14px; text-align:left; text-decoration:underline; text-underline-offset:2px; }
  .reset-link:hover{ color:var(--ink); }
  .sidebar-foot{ border-top:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; gap:10px; }
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex:0 0 auto;
  }
  .sidebar-foot .who{ flex:1; min-width:0; }
  .sidebar-foot .name{ font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-foot .portal{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }

  .content{ flex:1; min-width:0; }
  .content-header{ background:var(--surface); border-bottom:1px solid var(--line); padding:30px 40px 26px; }
  .content-header h1{ font-size:26px; margin:0 0 6px; }
  .content-header p{ margin:0; color:var(--ink-soft); font-size:14px; max-width:66ch; }
  .content-header .badges{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .content-body{ padding:28px 40px 80px; }

  .count-badge{
    display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); color:var(--ink-soft);
    font-size:12px; font-weight:600; padding:6px 10px 6px 12px; border-radius:999px;
  }
  .count-badge b{ background:var(--surface-3); color:var(--ink); border-radius:999px; padding:1px 7px; font-size:11.5px; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--btn-ink); border:none;
    padding:10px 18px; border-radius:9px; font-size:14.5px; font-weight:600;
  }
  .btn:hover{ background:var(--accent-strong); }
  .btn.secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn.secondary:hover{ border-color:var(--ink-faint); }
  .btn.danger{ background:var(--bad); color:#fff; }
  .btn.small{ padding:7px 12px; font-size:12.5px; border-radius:7px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- Stat tiles (Admin) ---- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px; box-shadow:var(--shadow); }
  .stat-tile .num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:30px; font-weight:500; color:var(--ink); }
  .stat-tile .lbl{ font-size:12.5px; color:var(--ink-faint); margin-top:4px; text-transform:uppercase; letter-spacing:.05em; }

  /* ---- Cards / table ---- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .qlist{ display:flex; flex-direction:column; }
  .qrow{
    display:grid; grid-template-columns:104px 1.15fr 1.1fr 68px 1fr 1.5fr 168px;
    gap:14px; align-items:center; padding:15px 18px; border-top:1px solid var(--line);
  }
  .qrow:first-child{ border-top:none; }
  .qrow.head{ background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .qrow .id{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .qrow .who{ font-size:14px; }
  .qrow .who .sub{ font-size:12px; color:var(--ink-faint); }
  .qrow .age{ font-size:13px; color:var(--ink-soft); }
  .qrow .loc{ font-size:13.5px; font-weight:600; }
  .qrow .loc.warn{ color:var(--bad); }
  .qrow .status-cell .cap{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; line-height:1.35; }
  .qrow .actions{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .empty{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:14px; }

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;
    white-space:nowrap; border:1px solid transparent;
  }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.current{ background:var(--current-soft); color:var(--current); }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }

  /* ---- Section header row (title + badges) ---- */
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin:26px 0 12px; display:flex; align-items:center; gap:10px; }

  /* ---- "My Request" tab + stepper cards (Student) ---- */
  .section-tab{
    display:inline-flex; align-items:center; gap:10px; background:var(--surface-2); color:var(--ink-soft);
    font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:600;
    padding:11px 20px; border-radius:10px; margin-bottom:20px;
  }
  .section-tab .chev{ color:var(--ink-faint); font-size:11px; }

  .req-step-card{ background:var(--surface-2); border-radius:18px; padding:20px 24px; margin-bottom:14px; }
  .req-step-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; }
  .req-step-name{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .req-step-name .title{ display:block; font-size:16px; text-transform:none; letter-spacing:0; color:var(--ink); font-family:"Lora",serif; font-weight:600; margin-bottom:3px; }
  .req-step-name .id{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint); text-transform:none; letter-spacing:0; }
  .info-btn{ background:var(--surface); border:1px solid var(--line); color:var(--ink-faint); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .info-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .info-btn svg{ width:15px; height:15px; }

  .stepper{ display:flex; align-items:flex-start; padding:2px 4px 0; }
  .step-node{ display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 0 auto; }
  .step-dot{ width:15px; height:15px; border-radius:50%; background:var(--ink-faint); border:2px solid var(--surface-2); }
  .step-dot.done{ background:var(--good); }
  .step-dot.current{ background:var(--current); }
  .step-dot.bad{ background:var(--bad); }
  .step-label{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); white-space:nowrap; max-width:90px; overflow:hidden; text-overflow:ellipsis; }
  .step-line{ flex:1 1 28px; height:2px; background:var(--surface-3); margin-top:7px; min-width:20px; }
  .step-line.done{ background:var(--good); }

  .req-step-foot{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .req-step-meta{ font-size:12.5px; color:var(--ink-faint); }

  /* ---- Modal ---- */
  .overlay{ position:fixed; inset:0; background:rgba(20,22,15,.45); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface); border-radius:16px; width:100%; max-width:580px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35); border:1px solid var(--line); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:19px; margin:0; }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--ink-faint); padding:4px 8px; border-radius:6px; }
  .modal-close:hover{ background:var(--surface-2); color:var(--ink); }
  .modal-body{ padding:24px; display:flex; flex-direction:column; gap:20px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font:inherit; font-size:14.5px;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .modal-foot{ padding:16px 24px 22px; display:flex; justify-content:flex-end; gap:10px; }

  /* ---- Detail dialog: key/value + paper route ---- */
  .kv-card{ background:var(--surface); }
  .kv-row{ display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--ink-faint); }
  .kv-row .v{ font-weight:600; text-align:right; }
  .kv-row .v.mono{ font-weight:500; }

  .panel-title{ font-family:"Lora",serif; font-size:15px; font-weight:600; margin:0 0 10px; }

  .route-list{ display:flex; flex-direction:column; }
  .route-item{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; }
  .route-dot{ width:11px; height:11px; border-radius:50%; margin-top:4px; flex:0 0 auto; background:var(--ink-faint); }
  .route-dot.done{ background:var(--good); }
  .route-dot.current{ background:var(--current); }
  .route-dot.bad{ background:var(--bad); }
  .route-body{ flex:1; display:flex; justify-content:space-between; gap:10px; }
  .route-name{ font-size:14px; font-weight:600; }
  .route-cap{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .route-tag{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .route-tag.done{ color:var(--good); }
  .route-tag.current{ color:var(--current); }

  /* ---- Timeline (full audit trail) ---- */
  .timeline{ display:flex; flex-direction:column; gap:0; margin-top:2px; }
  .tl-item{ display:grid; grid-template-columns:16px 1fr; gap:12px; }
  .tl-dot-col{ display:flex; flex-direction:column; align-items:center; }
  .tl-dot{ width:8px; height:8px; border-radius:50%; background:var(--brand); margin-top:5px; }
  .tl-line{ flex:1; width:1px; background:var(--line); margin-top:2px; }
  .tl-item:last-child .tl-line{ display:none; }
  .tl-body{ padding-bottom:14px; }
  .tl-body .txt{ font-size:13.5px; }
  .tl-body .ts{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .qr-wrap{ display:flex; align-items:center; gap:16px; background:var(--surface-2); border-radius:12px; padding:16px; }
  .qr-wrap img{ background:#fff; padding:6px; border-radius:6px; }
  .conf-bar{ height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; margin-top:6px; }
  .conf-bar > div{ height:100%; background:var(--brand); }

  .progress-modal{ text-align:center; padding:40px 24px; }
  .progress-modal .stage{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-soft); margin-top:16px; min-height:18px; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--surface-2); border-top-color:var(--brand); margin:0 auto; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }

  .rbac-table{ width:100%; border-collapse:collapse; font-size:14px; }
  .rbac-table th, .rbac-table td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); }
  .rbac-table th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); background:var(--surface-2); }

  .banner{ display:flex; gap:12px; align-items:flex-start; background:var(--current-soft); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:13.5px; color:var(--ink-soft); margin-bottom:24px; }
  .banner b{ color:var(--ink); }

  .offline-card{ max-width:460px; margin:60px auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:var(--shadow); text-align:left; }
  .offline-card h2{ margin:0 0 8px; font-size:19px; }
  .offline-card p{ color:var(--ink-soft); font-size:14px; }
  .offline-card pre{ background:var(--surface-2); border-radius:8px; padding:12px 14px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; overflow-x:auto; }

  /* ---- Login screen ---- */
  .login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:32px 30px 28px; }
  .login-brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:24px; }
  .login-brand .brand-mark{ width:42px; height:42px; font-size:21px; border-radius:11px; }
  .login-brand .brand-word{ font-size:22px; }
  .login-card .field{ margin-bottom:16px; }
  .login-error{ background:var(--bad-soft); color:var(--bad); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .login-card .btn{ width:100%; justify-content:center; padding:11px 18px; font-size:15px; }
  .demo-accounts{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); line-height:1.7; }
  .demo-accounts b{ color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; font-size:10px; display:block; margin-bottom:6px; }

  /* ---- Account management ---- */
  .acct-row{ display:grid; grid-template-columns:1.4fr 1fr 0.9fr 160px; gap:14px; align-items:center; padding:14px 18px; border-top:1px solid var(--line); }
  .acct-row:first-child{ border-top:none; }
  .acct-row.head{ background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .acct-row .actions{ display:flex; gap:6px; justify-content:flex-end; }
  .role-tag{ display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); text-transform:capitalize; }

  /* ---------------- Mobile staff app (viewport-driven, forced dark, staff-only) ---------------- */
  .mobile-badge{
    display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 5px;
    border-radius:999px; background:var(--surface-2); border:1px solid var(--line);
  }
  .mobile-badge .rev-mark{
    width:22px; height:22px; border-radius:7px; background:var(--ink); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-family:"Lora",serif; font-weight:700; font-size:12px; flex:0 0 auto;
  }
  .mobile-badge .rev-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:600; }
  .mobile-login-wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; }

  .mapp-shell{ min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  .mapp-topbar{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .mapp-topbar .rev-mark{ width:28px; height:28px; font-size:14px; border-radius:8px; }
  .mapp-topbar .brand-word{ font-family:"Lora",serif; font-weight:700; font-size:16px; color:var(--ink); }
  .mapp-topbar .spacer{ flex:1; }
  .mapp-icon-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto; }
  .mapp-icon-btn:hover{ color:var(--ink); }
  .mapp-body{ flex:1; padding:22px 18px 44px; display:flex; flex-direction:column; gap:14px; max-width:520px; margin:0 auto; width:100%; }
  .mapp-body h2{ font-size:19px; margin:0; }
  .mapp-sub{ font-size:12.5px; color:var(--ink-faint); margin:-8px 0 4px; }
  .mapp-tabs{ display:flex; gap:8px; margin-bottom:2px; }

/* =======================================================================
   DocuRoute — click-through prototype (desktop)
   Data Layer is Supabase (Postgres + Auth + Storage) — see supabase/schema.sql
   for the tables, RLS policies, and storage bucket. supabase-config.js holds
   the project URL/anon key and the shared `sb` client. This page is a pure
   client of that shared, multi-user, cloud-hosted state — no localStorage
   fallback for data (Supabase's own SDK caches the auth session there).
   Simulates the Section 3.10 pipeline: intake -> AI processing -> the
   70%-confidence gate -> deterministic routing table -> office action.
   ======================================================================= */

// Section 1.9's deterministic routing table (Dean's Office/Registrar/Treasury/Section Chief).
const ROUTES = {
  waiver:     ["Dean's Office","Registrar"],
  adjustment: ["Section Chief","Registrar"],
  clearance:  ["Treasury","Dean's Office","Registrar"]
};
// Registrar (capturing a walk-in) picks the destination office directly instead
// of naming a "document type" — each office maps back to exactly one type/route,
// since Dean's Office/Section Chief/Treasury are each the first hop of only one
// route above.
const OFFICE_TO_TYPE = { "Dean's Office":"waiver", "Section Chief":"adjustment", "Treasury":"clearance" };
// A student submitting online never declares a type either — the AI
// Processing Layer is what's supposed to work that out, so declaring it up
// front via a dropdown would defeat the point. Only used as a last-resort
// guess inside finishPipeline() when the real classifier is unreachable —
// never at submission time, since a guess made there could never be
// corrected if the real classifier's response arrives too late or not at all.
function randomType(){
  const types = Object.keys(ROUTES);
  return types[Math.floor(Math.random() * types.length)];
}

// Local stand-in for the Section 3.10 AI Processing Layer (see ai-classifier/
// at the project root) -- only reachable while you're running its server on
// your own machine (`python serve.py`) and testing this page via file://.
// Once that service is hosted somewhere real (the planned Render backend),
// this becomes an https:// URL instead and no other code here needs to change.
const CLASSIFY_API_URL = "http://127.0.0.1:5001/classify";

// Returns {type, confidence} from the real classifier, or null if it's
// unreachable (server not running, CORS/mixed-content blocked, etc.) -- callers
// fall back to the old simulated confidence so the demo never breaks.
async function callClassifyApi({ file, text }){
  try{
    let res;
    if(file){
      const form = new FormData();
      form.append("file", file, file.name);
      res = await fetch(CLASSIFY_API_URL, { method:"POST", body: form });
    } else {
      res = await fetch(CLASSIFY_API_URL, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ text: text || "" })
      });
    }
    if(!res.ok) return null; // network/server error -- caller falls back to simulation
    const data = await res.json();
    if(typeof data.confidence !== "number") return null; // malformed response -- fall back
    // data.type may legitimately be null here: the real classifier explicitly
    // decided this isn't one of our 3 types (matched the "other" prototype, or
    // scored near-zero across the board). That's a real result, not a failure
    // -- it must NOT be treated the same as "server unreachable" below.
    return { type: data.type || null, confidence: data.confidence };
  }catch(e){
    return null; // offline/unreachable -- caller falls back to simulation
  }
}

// Portal access rules: a logged-in account only ever sees its own role's pages.
// A staff account is additionally scoped to exactly one office (profiles.office,
// enforced at the RLS level too — see supabase/schema.sql) instead of the old
// single shared "Staff" role that covered every office's queue at once.
const PAGES = {
  student: [ { id:"active",        label:"Active Requests", icon:"doc" },
             { id:"notifications", label:"Notifications",   icon:"bell" } ],
  admin:   [ { id:"overview",      label:"System Overview", icon:"grid" },
             { id:"accounts",      label:"Account Management", icon:"users" } ]
};
const OFFICE_PAGES = {
  "Registrar":     { id:"registrar",    label:"Registrar Queue",      icon:"inbox" },
  "Treasury":      { id:"treasury",     label:"Treasury Queue",       icon:"wallet" },
  "Section Chief": { id:"sectionchief", label:"Section Chief Review", icon:"cap" },

};
const UNASSIGNED_PAGE = { id:"unassigned", label:"No Office Assigned", icon:"info" };
function pagesForSession(s){
  if(s.role === "staff") return [ (s.office && OFFICE_PAGES[s.office]) || UNASSIGNED_PAGE ];
  return PAGES[s.role];
}
const PORTAL_LABEL = { student:"Student Portal", admin:"Admin Portal" };
const OFFICE_PORTAL_LABEL = {
  "Registrar":"Registrar Portal", "Treasury":"Treasury Portal",
  "Section Chief":"Section Chief Portal", "Dean's Office":"Dean Portal"
};
function portalLabel(s){
  return s.role === "staff" ? (OFFICE_PORTAL_LABEL[s.office] || "Staff Portal") : PORTAL_LABEL[s.role];
}
const TYPE_LABEL = { waiver:"Prerequisite Waiver", adjustment:"Section Adjustment", clearance:"Student Clearance" };
// A submitted-but-not-yet-classified request has type=null (see
// finishPipeline() / the requests.type migration) -- fall back to a label
// instead of rendering the literal string "undefined" during that window.
function typeLabel(t){ return TYPE_LABEL[t] || "Classifying…"; }

let session = null; // {id, username, role, name, studentNo, program}
let state = { requests: [], accounts: [] };
let apiOnline = false;
let loginError = "";

async function loadSession(){
  const { data } = await sb.auth.getSession();
  if(!data.session){ session = null; return; }
  await hydrateProfile(data.session.user);
}

/* ---------------- Supabase data layer ---------------- */

class ApiError extends Error {}

async function hydrateProfile(user){
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !data){ session = null; return; }
  session = { id:user.id, email:data.email || user.email, role:data.role, office:data.office, name:data.name, studentNo:data.student_no, program:data.program };
}

function mapRequestRow(row){
  const logs = (row.request_logs || []).slice().sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  return {
    id: row.id, type: row.type, student: row.student_name, studentNo: row.student_no,
    program: row.program, contactNo: row.contact_no, fields: row.fields || {},
    confidence: row.confidence, route: row.route, hop: row.hop, status: row.status,
    documentPath: row.document_path,
    log: logs.map(l => ({ ts: l.ts, text: l.text }))
  };
}

async function addLog(requestId, text){
  const { error } = await sb.from("request_logs").insert({ request_id: requestId, text });
  if(error) throw new ApiError(error.message);
}

async function refresh(){
  const { data, error } = await sb.from("requests").select("*, request_logs(ts,text)").order("created_at", { ascending:true });
  if(error) throw new ApiError(error.message);
  state.requests = data.map(mapRequestRow);
  apiOnline = true;
}
async function refreshAccounts(){
  const { data, error } = await sb.from("profiles").select("*").order("name");
  if(error) throw new ApiError(error.message);
  state.accounts = data.map(a => ({ id:a.id, username:a.email, role:a.role, office:a.office, name:a.name, studentNo:a.student_no, program:a.program }));
  apiOnline = true;
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-PH",{month:"short",day:"numeric"}) + " · " +
         d.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"});
}
function fmtAge(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.max(1, Math.round(diffMs / 60000));
  if(mins < 60) return mins + " min" + (mins===1?"":"s");
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + " hr" + (hrs===1?"":"s");
  const days = Math.round(hrs/24);
  return days + " day" + (days===1?"":"s");
}

const SUPABASE_ANON_KEY = "eyJ...";</pre>
    <p>Then reload this page.</p>
  </div></div>`;
}

function renderRoot(){
  const root = document.getElementById("root");
  if(!SUPABASE_CONFIGURED){ root.innerHTML = configNeededHtml(); return; }
  if(isMobile()) return renderMobileRoot();
  if(!session){
    root.innerHTML = `<div class="login-shell"><div class="login-card" id="loginCard"></div></div>`;
    renderLogin();
    return;
  }
  root.innerHTML = `<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="content" id="view"></main></div>`;

/* ---------------- Login ---------------- */

function renderLogin(){
  const card = document.getElementById("loginCard");
  card.innerHTML = `
    <div class="login-brand">
      <div class="brand-mark">&Omega;</div>
      <div class="brand-word">DocuRoute</div>
    </div>
    ${loginError ? `<div class="login-error">${loginError}</div>` : ""}
    <div class="field"><label>School Email Address</label><input id="lUser" autocomplete="username" placeholder="you@mymail.mapua.edu.ph"></div>
    <div class="field"><label>Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn">Log In</button>
    <div class="demo-accounts">
      <b>Demo accounts</b>
      Student — apvsanpedro@mymail.mapua.edu.ph / aaron<br>
      Student — mefvocal@mymail.mapua.edu.ph / mike<br>
      Registrar — registrar@mymail.mapua.edu.ph / registrar<br>
      Treasury — treasury@mymail.mapua.edu.ph / treasury<br>
      Section Chief — prof@mymail.mapua.edu.ph / profff<br>
      Dean — dean@mymail.mapua.edu.ph / deanss<br>
      Admin — admin@mymail.mapua.edu.ph / admin
    </div>
  `;
  const submit = async ()=>{
    const email = document.getElementById("lUser").value.trim();
    const password = document.getElementById("lPass").value;
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await hydrateProfile(data.user);
      if(!session) throw new Error("No profile found for this account — see supabase/schema.sql.");
      loginError = ""; apiOnline = true;
      await bootAfterLogin();
    }catch(e){
      loginError = e.message || "Could not reach Supabase.";
      renderLogin();
    }
  };
  document.getElementById("loginBtn").addEventListener("click", submit);
  card.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
  });
}

async function logout(){
  await sb.auth.signOut();
  session = null;
  renderRoot();
}

async function bootAfterLogin(){
  state.page = pagesForSession(session)[0].id;
  try{
    await refresh();
    if(session.role === "admin") await refreshAccounts();
  }catch(e){ apiOnline = false; }
  renderRoot();
}

function renderSidebar(){
  const el = document.getElementById("sidebar");
  const pages = pagesForSession(session);
  const current = state.page || pages[0].id;
  el.innerHTML = `
    <div class="sidebar-brand">
      <div class="brand-mark">&Omega;</div>
      <div class="brand-word">DocuRoute</div>
    </div>
    <div class="nav-label">Navigation</div>
    <nav class="sidebar-nav">
      ${pages.map(p => `

        </button>
      `).join("")}
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="conn-row">
      <span class="conn-dot ${apiOnline?"":"off"}"></span>
      ${apiOnline ? "Connected to Supabase" : "Supabase unreachable"}
    </div>
    <button class="reset-link" id="logoutBtn">&#8592; log out</button>
    <div class="sidebar-foot">
      <div class="avatar">${session.name.charAt(0)}</div>
      <div class="who">
        <div class="name">${session.name}</div>
        <div class="portal">${portalLabel(session)}</div>
      </div>
    </div>
  `;
  el.querySelectorAll("[data-page]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.page = btn.dataset.page; renderRoot(); });
  });
  document.getElementById("logoutBtn").addEventListener("click", logout);
}

function renderPage(){
  const key = session.role + ":" + (state.page || pagesForSession(session)[0].id);
  if(key === "student:active") return studentActiveView();
  if(key === "student:notifications") return studentNotificationsView();
  if(key === "staff:registrar") return registrarQueueView();
  if(key === "staff:treasury") return treasuryQueueView();
  if(key === "staff:sectionchief") return sectionChiefView();
  if(key === "staff:dean") return deanDecidesView();
  if(key === "staff:unassigned") return unassignedOfficeView();
  if(key === "admin:overview") return adminOverviewView();
  if(key === "admin:accounts") return accountManagementView();
  return `<div class="content-body"><div class="empty">Unknown page.</div></div>`;
}

function offlineHtml(){
  return `
    <div class="content-header">
      <h1>Can't reach Supabase</h1>
      <p>This prototype's data (and accounts) now live in a shared Supabase project instead of a local server.</p>
    </div>
    <div class="content-body">
      <div class="offline-card">
        <h2>Check your connection</h2>
        <p>Confirm you have internet access, and that the project referenced in <span class="mono">supabase-config.js</span> hasn't paused itself — free-tier Supabase projects pause after about a week with no API activity. Open the project in the Supabase dashboard to resume it.</p>
        <button class="btn" id="retryBtn">Retry connection</button>
      </div>
    </div>
  `;
}
function wireOfflineRetry(){
  const btn = document.getElementById("retryBtn");
  if(btn) btn.addEventListener("click", async ()=>{
    try{ await refresh(); if(session.role==="admin") await refreshAccounts(); }catch(e){}
    renderRoot();
  });
}

/* =======================================================================
   Mobile app — viewport-driven (narrow screens only), forced dark theme,
   every role welcome. Student and Admin get purpose-built, spacious mobile
   layouts of their own pages (not the desktop grids squeezed narrower).
   Staff additionally gets phone-specific tools — OCR intake capture and
   live QR-code scanning — matching Section 3.10's field-use case: staff
   photographing a paper form or scanning a document's QR label in the office.
   ======================================================================= */

const MOBILE_QUERY = window.matchMedia("(max-width: 680px)");
function isMobile(){ return MOBILE_QUERY.matches; }
function applyViewportTheme(){
  if(isMobile()) document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
}

let mobileScreen = "menu"; // staff tool flow only: menu | capture | scan
let qrStreamHandle = null;

function mobileBadgeHtml(){

}

function renderMobileRoot(){
  const root = document.getElementById("root");

    root.innerHTML = `<div class="mobile-login-wrap">${mobileBadgeHtml()}<div class="login-card" id="loginCard"></div></div>`;

  }
  if(!apiOnline){
    root.innerHTML = `<div class="mapp-shell">${mobileTopbarHtml()}<div class="mapp-body">${offlineHtml()}</div></div>`;
    wireOfflineRetry();
    return;
  }
  if(!state.page || !pagesForSession(session).some(p => p.id === state.page)) state.page = pagesForSession(session)[0].id;
  root.innerHTML = mobileAppShellHtml();
  wireMobileView();
}

function mobileTopbarHtml(){

async function startQrScanner(){
  const video = document.getElementById("qrVideo");
  const viewfinder = document.getElementById("mappViewfinder");
  if(!video || !viewfinder) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    viewfinder.innerHTML = `<div class="cam-error">Camera access needs a secure (HTTPS) context — this works once deployed to Vercel. Use the tracking ID field below for now.</div>`;
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    qrStreamHandle = stream;
    video.srcObject = stream;
    await video.play();
    const canvas = document.getElementById("qrCanvas");
    const ctx = canvas.getContext("2d");
    const tick = ()=>{
      if(mobileScreen !== "scan" || !qrStreamHandle) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = (typeof jsQR === "function") ? jsQR(imageData.data, imageData.width, imageData.height) : null;
        if(code && code.data){ stopQrScanner(); handleQrDecoded(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }catch(e){
    viewfinder.innerHTML = `<div class="cam-error">Couldn't access the camera (${e.message}). Use the tracking ID field below instead.</div>`;
  }
}
function stopQrScanner(){
  if(qrStreamHandle){ qrStreamHandle.getTracks().forEach(t=>t.stop()); qrStreamHandle = null; }
}

function handleQrDecoded(text){
  const req = state.requests.find(r => r.id === text.trim());
  const resultEl = document.getElementById("mappScanResult");
  if(!resultEl) return;
  if(!req){
    resultEl.innerHTML = `<div class="mapp-scan-result">Unrecognized code: <span class="mono">${text}</span></div>`;
    return;
  }
  const canAct = req.status !== "completed" && req.status !== "declined";
  resultEl.innerHTML = `
    <div class="mapp-scan-result">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:600;">${typeLabel(req.type)}</div>${pill(req.status)}
      </div>
      <div class="kv-row"><span class="k">ID</span><span class="v mono">${req.id}</span></div>
      <div class="kv-row"><span class="k">Student</span><span class="v">${req.student}</span></div>
      <div class="kv-row"><span class="k">Current office</span><span class="v">${currentOfficeLabel(req)}</span></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        ${req.status === "unverified" ? `<button class="btn small" data-mconfirm="${req.id}">Confirm &amp; Route</button>` :
          canAct ? `<button class="btn small" data-madvance="${req.id}">${req.status === "routed" ? "Mark In Progress" : "Advance"}</button>` : ""}
        <button class="btn secondary small" data-mview="${req.id}">View Full Details</button>
      </div>
    </div>
  `;
  resultEl.querySelectorAll("[data-mconfirm]").forEach(b => b.addEventListener("click", () => confirmAndRoute(b.dataset.mconfirm)));
  resultEl.querySelectorAll("[data-madvance]").forEach(b => b.addEventListener("click", () => advanceRequest(b.dataset.madvance)));
  resultEl.querySelectorAll("[data-mview]").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.mview)));
}

/* ---------------- Status helpers ---------------- */

function pill(status){
  const map = {
    submitted:["neutral","Submitted"], review:["neutral","AI Review"],
    unverified:["bad","Unverified"], routed:["current","Routed"],
    progress:["current","In Progress"], completed:["good","Completed"],
    approved:["good","Approved"], declined:["bad","Declined"]
  };
  const [cls,label] = map[status] || ["neutral",status];
  return `<span class="pill ${cls}">${label}</span>`;
}
function confPill(r){
  if(r.status==="unverified") return `<span class="pill bad">${r.confidence}% Conflict</span>`;
  if(r.status==="declined") return `<span class="pill bad">Declined</span>`;
  if(r.status==="completed") return `<span class="pill good">Completed</span>`;
  if(r.confidence!==null) return `<span class="pill good">${r.confidence}% Suggested</span>`;
  return pill(r.status);
}
function statusCaption(r){
  if(r.status==="unverified") return "Confidence below 70% threshold — needs manual classification.";
  if(r.status==="declined"){ const last=r.log[r.log.length-1]; return last ? last.text : ""; }
  if(r.status==="completed") return "All offices cleared — audit trail closed.";
  if(r.status==="submitted" || r.status==="review") return "Awaiting AI Processing Layer.";
  const prevIdx = r.hop - 1;
  return prevIdx>=0 ? `${r.route[prevIdx]} → ${r.route[r.hop]}` : `Awaiting action at ${r.route[r.hop]}`;
}
function currentOfficeLabel(req){
  if(req.status==="submitted" || req.status==="review") return "AI Processing Layer";
  if(req.status==="unverified") return "Intake Clerk queue";
  if(req.status==="completed" || req.status==="declined") return "Closed";
  return req.route[req.hop];
}

function stepDotClass(i, route, hop, status){
  if(status==="completed") return "done";
  if(status==="declined") return i<hop ? "done" : (i===hop ? "bad" : "");
  if(i<hop) return "done";
  if(i===hop) return "current";
  return "";
}
function stepperHtml(route, hop, status){
  return `<div class="stepper">${route.map((loc,i)=>`
      <div class="step-node">
        <div class="step-dot ${stepDotClass(i,route,hop,status)}"></div>
        <div class="step-label">${loc}</div>
      </div>
      ${i<route.length-1 ? `<div class="step-line ${i<hop?"done":""}"></div>` : ""}
    `).join("")}</div>`;
}

async function applySeedPlan(id, type, confidence, plan){
  await addLog(id, "AI Processing Layer: image rectified, OCR extracted, layout-aware classification run.");
  const route = ROUTES[type];
  if(confidence < 70){
    await addLog(id, `Confidence ${confidence}% is below the 70% threshold - flagged 'Unverified' and sent to the intake clerk queue.`);
    await sb.from("requests").update({ confidence, status:"unverified" }).eq("id", id);
    if(plan === "unverified") return;
  } else {
    await addLog(id, `Confidence ${confidence}% - deterministic routing table assigned this request. QR sticker printed, digital twin archived.`);
    await sb.from("requests").update({ confidence, status:"routed" }).eq("id", id);
    if(plan === "routed") return;
  }
  let hop = 0;
  if(plan === "progress" || plan === "completed"){
    await addLog(id, `${route[hop]} marked the request In Progress.`);
    await sb.from("requests").update({ status:"progress" }).eq("id", id);
    if(plan === "progress") return;
  }
  if(plan === "completed"){
    while(hop < route.length - 1){
      await addLog(id, `${route[hop]} cleared the request - forwarded to ${route[hop+1]}.`);
      hop++;
    }
    await addLog(id, `${route[hop]} gave final approval. Request closed.`);
    await sb.from("requests").update({ status:"completed", hop }).eq("id", id);
  }
}

async function handleSubmitRequest(){
  // Staff capturing a walk-in (mobile field intake) picks the destination
  // office directly (#fOffice); a student submitting online never does — see
  // OFFICE_TO_TYPE above, and finishPipeline() for how a student's type gets
  // resolved (by the real classifier, or randomType() as a last-resort
  // simulated guess if it's unreachable).
  const officeSel = document.getElementById("fOffice");
  const isStaffCapture = !!officeSel;
  // Staff capture already knows the office/type. A student's document is
  // genuinely unclassified until the AI pipeline (finishPipeline, below) runs
  // -- guessing a type here and writing it straight to the route column was
  // the bug: on the deployed HTTPS site, the browser silently blocks the call
  // to the local classify service (mixed content), callClassifyApi() always
  // fails, and that random guess was never corrected -- every student
  // submission got routed to a random office unrelated to the actual document.
  const type = isStaffCapture ? OFFICE_TO_TYPE[officeSel.value] : null;
  const student = document.getElementById("fName").value || "Unnamed Student";
  const studentNo = document.getElementById("fStudentNo").value || "—";
  const program = document.getElementById("fProgram").value || "—";
  const contactNo = document.getElementById("fContact").value || "—";
  const fields = {};
  if(isStaffCapture){
    if(type==="waiver"){ fields.quarterAY=val("tQuarter"); fields.prereq=val("tPrereq"); fields.advanced=val("tAdvanced"); }
    if(type==="adjustment"){ fields.currentSection=val("tCurrent"); fields.newSection=val("tNew"); fields.subject=val("tSubject"); }
    if(type==="clearance"){ fields.reason=val("tReason"); }
  } else {
    fields.details = val("tDetails") || "";
  }
  const fileInput = document.getElementById("fFile");
  const file = fileInput && fileInput.files[0];

  closeModal();
  try{
    const { data: id, error: idErr } = await sb.rpc("next_request_id");
    if(idErr) throw new ApiError(idErr.message);
    // A student submits their own request (student_id = them); staff capturing a
    // walk-in's paper form on mobile has no portal account to link it to.
    const studentIdForRow = session.role === "student" ? session.id : null;
    const { error: insErr } = await sb.from("requests").insert({
      id, type, student_id: studentIdForRow, student_name: student, student_no: studentNo,
      program, contact_no: contactNo, fields, confidence: null, route: ROUTES[type] || [], hop: 0, status: "submitted"
    });
    if(insErr) throw new ApiError(insErr.message);
    await addLog(id, `Submitted by ${student} - document uploaded to DocuRoute.`);
    if(file){
      const path = `${id}/${file.name}`;
      const { error: upErr } = await sb.storage.from("documents").upload(path, file, { upsert:true });
      if(!upErr) await sb.from("requests").update({ document_path: path }).eq("id", id);
    }
    await refresh();
    // Staff already told us the office/type directly (see OFFICE_TO_TYPE
    // above) -- re-classifying on top of an explicit human decision would
    // just be confusing, so only student (blind) submissions get run through
    // the real/simulated classifier.
    runAiPipeline(id, { file, text: fields.details, skipClassification: isStaffCapture });
  }catch(e){ alert(e.message || "Could not reach Supabase."); renderRoot(); }
}
function val(id){ const el = document.getElementById(id); return el ? el.value : ""; }

/* ---------------- AI pipeline animation ---------------- */

function runAiPipeline(id, ctx){
  ctx = ctx || {};
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="progress-modal">
      <div class="spinner"></div>
      <div class="stage" id="stageTxt">Rectifying image…</div>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  const stages = ["Rectifying image (deskew · crop · contrast)…","Running OCR text extraction…","Layout-aware multimodal classification…","Applying confidence gate…"];
  let i = 0;
  const stageEl = document.getElementById("stageTxt");
  const timer = setInterval(()=>{
    i++;
    if(i < stages.length){ stageEl.textContent = stages[i]; return; }
    clearInterval(timer);
    finishPipeline(id, ctx);
  }, 550);
}
async function finishPipeline(id, ctx){
  ctx = ctx || {};
  try{
    let type = null, confidence = null, usedRealClassifier = false;
    if(!ctx.skipClassification){
      const result = await callClassifyApi({ file: ctx.file, text: ctx.text });
      if(result){ type = result.type; confidence = result.confidence; usedRealClassifier = true; }
    }
    if(confidence === null){
      // Real classifier unreachable/skipped -- simulate as before. Staff
      // capture already declared its type at submission (OFFICE_TO_TYPE) and
      // is untouched here; a student submission with no reachable real
      // classifier gets the same random guess it always did, just made now
      // (at classification time) instead of at insert time, so a real
      // classifier that *does* respond a moment later always wins instead of
      // this guess silently sticking forever (the original bug).
      confidence = Math.floor(55 + Math.random()*44);
      if(!ctx.skipClassification) type = randomType();
    }
    // Staff capture already has a valid type/route from insert (this
    // function never re-derives it), so gate on confidence alone for that
    // path. A student submission needs both a resolved type AND >=70%
    // confidence to auto-route -- an explicit "not one of our 3 types"
    // result (type stays null) or a below-gate confidence both fall to
    // manual review instead of silently routing nowhere useful.
    const status = ctx.skipClassification
      ? (confidence < 70 ? "unverified" : "routed")
      : (type && ROUTES[type] && confidence >= 70 ? "routed" : "unverified");
    const update = { confidence, status };
    if(!ctx.skipClassification && status === "routed"){ update.type = type; update.route = ROUTES[type]; }

    await addLog(id, usedRealClassifier
      ? (type
          ? `AI Processing Layer: OCR extracted, classified as ${TYPE_LABEL[type] || type} by the local classify service.`
          : `AI Processing Layer: OCR extracted, but the local classify service did not recognize this as one of our 3 document types (best match ${confidence}%) - needs manual classification.`)
      : "AI Processing Layer: image rectified, OCR extracted, layout-aware classification run (simulated -- local classify service unreachable or not applicable).");
    await addLog(id, status !== "routed"
      ? `Confidence ${confidence}% is below the 70% threshold - flagged 'Unverified' and sent to the intake clerk queue.`
      : `Confidence ${confidence}% - deterministic routing table assigned this request. QR sticker printed, digital twin archived.`);
    await sb.from("requests").update(update).eq("id", id);
  }catch(e){}
  await refresh();
  closeModal();
  renderRoot();
  openDetail(id);
}

        ${routeListHtml(req)}
      </div>

      <div class="qr-wrap">
        <div id="qrHolder"></div>
        <div style="font-size:13px;color:var(--ink-soft)">Scan to link this physical form to its digital-twin record.<br><span class="mono" style="font-size:11.5px">${req.id}</span></div>
      </div>

      ${req.documentPath ? `<div><button class="btn secondary small" id="viewDocBtn">View attached form</button></div>` : ""}

      <div>
        <div class="panel-title">Audit Trail</div>
        <div class="timeline">
          ${req.log.map(l=>`
            <div class="tl-item">
              <div class="tl-dot-col"><div class="tl-dot"></div><div class="tl-line"></div></div>
              <div class="tl-body"><div class="txt">${l.text}</div><div class="ts">${fmtTs(l.ts)}</div></div>
            </div>`).join("")}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>Close</button>
    </div>
  `;
  document.getElementById("overlay").classList.add("open");
  try{
    new QRCode(document.getElementById("qrHolder"), { text: req.id, width:84, height:84, colorDark:"#20241F", colorLight:"#ffffff" });
  }catch(e){ document.getElementById("qrHolder").textContent = req.id; }
  const viewDocBtn = document.getElementById("viewDocBtn");
  if(viewDocBtn) viewDocBtn.addEventListener("click", async ()=>{
    const { data, error } = await sb.storage.from("documents").createSignedUrl(req.documentPath, 60);
    if(!error && data && data.signedUrl) window.open(data.signedUrl, "_blank");
    else alert("Could not load the attached document.");
  });
}

/* ---------------- Wiring ---------------- */

function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("modal").innerHTML = "";
}
function wireViewEvents(){ wireCommonActions(); }

function wireCommonActions(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=> openDetail(el.dataset.open));
  });
  document.querySelectorAll("[data-confirm]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); confirmAndRoute(el.dataset.confirm); });
  });
  document.querySelectorAll("[data-advance]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); advanceRequest(el.dataset.advance); });
  });
  document.querySelectorAll("[data-decline]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); declineRequest(el.dataset.decline); });
  });
  const newBtn = document.getElementById("newReqBtn");
  if(newBtn) newBtn.addEventListener("click", openNewRequestModal);
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", async ()=>{
    if(!confirm("Reset the demo requests? This clears every request in the shared Supabase project. Accounts are kept.")) return;
    try{ await resetDemoRequests(); await refresh(); }catch(e){ alert(e.message || "Could not reach Supabase to reset it."); }
    renderRoot();
  });
  const newAcctBtn = document.getElementById("newAcctBtn");
  if(newAcctBtn) newAcctBtn.addEventListener("click", ()=> openAccountModal(null));
  document.querySelectorAll("[data-edit-acct]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const acct = state.accounts.find(a=>a.id===el.dataset.editAcct);
      openAccountModal(acct);
    });
  });
  document.querySelectorAll("[data-delete-acct]").forEach(el=>{
    el.addEventListener("click", ()=> deleteAccount(el.dataset.deleteAcct));
  });
}

document.getElementById("overlay").addEventListener("click", (e)=>{
  if(e.target.id==="overlay" || e.target.closest("[data-close]")) closeModal();
});

async function init(){
  applyViewportTheme();
  MOBILE_QUERY.addEventListener("change", ()=>{ stopQrScanner(); applyViewportTheme(); renderRoot(); });
  if(!SUPABASE_CONFIGURED){ renderRoot(); return; }
  await loadSession();
  if(session){
    state.page = pagesForSession(session)[0].id;
    try{
      await refresh();
      if(session.role === "admin") await refreshAccounts();
    }catch(e){ apiOnline = false; }
  }
  renderRoot();
}
init();
</script>
</body>
</html>
