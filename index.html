<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuRoute Prototype</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  /* Design tokens — from Figma "DocuRoute · UI/UX Redesign — Light Theme"
     (frames 9:10 / 9:57). Dark values are derived (no dark frames yet). */
  :root{
    --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#EFEDE5; --surface-3:#E3E1D8;
    --soft:#EBF3EA;                       /* "Surface / soft" — summary band, routed pill */
    --ink:#19261E; --ink-soft:#657369; --ink-faint:#8A958C;
    --accent:#1F3D2E; --accent-strong:#163024; --btn-ink:#FFFFFF;   /* primary button = forest */
    --brand:#1F3D2E; --brand-strong:#122318;
    --good:#1F7A4D; --good-soft:#E1F2E7;
    --current:#A4660A; --current-soft:#FFF3DB; /* "amberBg" pill */
    --bad:#C0392B; --bad-soft:#FBE3E1;
    --line:#DDE5DC;
    /* Sidebar (forest) */
    --side-bg:#1F3D2E; --side-active:#345342; --side-ink:#FFFFFF; --side-muted:#AFC6B1; --side-faint:#C2DAC4;
    --radius-btn:10px; --radius-card:15px; --radius-band:16px;
    --shadow:0 1px 2px rgba(25,38,30,.04), 0 10px 26px -16px rgba(25,38,30,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121813; --surface:#1A221C; --surface-2:#222B24; --surface-3:#2B352D;
      --soft:#1F3127;
      --ink:#E9EEE8; --ink-soft:#A9B5AB; --ink-faint:#7D8A80;
      --accent:#3F8F65; --accent-strong:#4FA676; --btn-ink:#FFFFFF;
      --brand:#6FCE9C; --brand-strong:#9BE0BA;
      --good:#5FBF8E; --good-soft:#1B2F22;
      --current:#E9B055; --current-soft:#3A2D14;
      --bad:#E5766B; --bad-soft:#3A201D;
      --line:#2E3A31;
      --side-bg:#0F1A13; --side-active:#22382B; --side-muted:#8FA894; --side-faint:#A6BFAA;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121813; --surface:#1A221C; --surface-2:#222B24; --surface-3:#2B352D;
    --soft:#1F3127;
    --ink:#E9EEE8; --ink-soft:#A9B5AB; --ink-faint:#7D8A80;
    --accent:#3F8F65; --accent-strong:#4FA676; --btn-ink:#FFFFFF;
    --brand:#6FCE9C; --brand-strong:#9BE0BA;
    --good:#5FBF8E; --good-soft:#1B2F22;
    --current:#E9B055; --current-soft:#3A2D14;
    --bad:#E5766B; --bad-soft:#3A201D;
    --line:#2E3A31;
    --side-bg:#0F1A13; --side-active:#22382B; --side-muted:#8FA894; --side-faint:#A6BFAA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter", ui-sans-serif, system-ui, sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:"Lora", ui-serif, Georgia, serif; font-weight:600; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  button{ font:inherit; cursor:pointer; }
  a{ color:inherit; }

  /* ---- App shell: sidebar + content ---- */
  .app-shell{ display:flex; min-height:100vh; align-items:stretch; }
  /* Forest sidebar (Figma 9:10: 250px, active item #345342, r10) */
  .sidebar{
    width:250px; flex:0 0 250px; background:var(--side-bg); color:var(--side-ink);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:28px 22px 0 28px; }
  .logo-img, .logo-img img{ display:block; max-width:100%; height:auto; }
  .sidebar-brand .logo-img{ width:190px; }
  .sidebar-sub{ padding:10px 22px 0 28px; font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--side-muted); }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:"Lora",serif; font-weight:700; font-size:18px; flex:0 0 auto;
  }
  .sidebar .brand-mark{ background:#fff; color:var(--side-bg); }
  .brand-word{ font-family:"Inter",sans-serif; font-weight:600; font-size:19px; letter-spacing:.02em; color:var(--brand); }
  .sidebar .brand-word{ color:var(--side-ink); }
  .nav-label{ display:none; }
  .sidebar-nav{ padding:44px 17px 0; }
  .nav-item{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    min-height:42px; padding:10px 19px; border-radius:var(--radius-btn); font-size:14px; color:var(--side-ink);
    background:none; border:none; margin-bottom:14px;
  }
  .nav-item svg{ width:17px; height:17px; flex:0 0 auto; opacity:.85; }
  .nav-item:hover{ background:rgba(255,255,255,.06); }
  .nav-item.active{ background:var(--side-active); font-weight:600; }
  .nav-item:focus-visible, .btn:focus-visible, .tabbar-item:focus-visible{ outline:2px solid var(--side-faint); outline-offset:2px; }
  .sidebar-spacer{ flex:1; }
  .conn-row{ display:flex; align-items:center; gap:8px; padding:0 28px 12px; font-size:12px; color:var(--side-faint); }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background:var(--side-faint); flex:0 0 auto; }
  .conn-dot.off{ background:#E5766B; }
  .reset-link{ background:none; border:none; color:var(--side-muted); font-size:12px; padding:0 28px 14px; text-align:left; text-decoration:underline; text-underline-offset:2px; }
  .reset-link:hover{ color:var(--side-ink); }
  .sidebar-foot{ padding:14px 28px 26px; display:flex; align-items:center; gap:10px; }
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--side-active); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex:0 0 auto;
  }
  .sidebar-foot .who{ flex:1; min-width:0; }
  .sidebar-foot .name{ font-size:13px; font-weight:600; color:var(--side-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-foot .portal{ font-size:11px; color:var(--side-muted); }

  /* Content header — no white band in the redesign; title sits on the cream page */
  .content{ flex:1; min-width:0; }
  .content-header{ padding:34px 46px 0; max-width:1180px; }
  .content-header .eyebrow{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:24px; }
  .content-header h1{ font-size:32px; margin:0 0 8px; color:var(--ink); }
  .content-header p{ margin:0; color:var(--ink-soft); font-size:14px; max-width:66ch; }
  .content-header .badges{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .content-body{ padding:28px 46px 80px; max-width:1180px; }

  .count-badge{
    display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); color:var(--ink-soft);
    font-size:12px; font-weight:600; padding:6px 10px 6px 12px; border-radius:999px;
  }
  .count-badge b{ background:var(--surface-3); color:var(--ink); border-radius:999px; padding:1px 7px; font-size:11.5px; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--btn-ink); border:none;
    min-height:44px; padding:10px 18px; border-radius:var(--radius-btn); font-size:14px; font-weight:600;
  }
  .btn:hover{ background:var(--accent-strong); }
  .btn.secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn.secondary:hover{ border-color:var(--ink-faint); }
  .btn.danger{ background:var(--bad); color:#fff; }
  .btn.small{ min-height:34px; padding:7px 12px; font-size:12.5px; border-radius:8px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- Stat tiles (Admin) ---- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px; box-shadow:var(--shadow); }
  .stat-tile .num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:30px; font-weight:500; color:var(--ink); }
  .stat-tile .lbl{ font-size:12.5px; color:var(--ink-faint); margin-top:4px; text-transform:uppercase; letter-spacing:.05em; }

  /* ---- Cards / table ---- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); box-shadow:var(--shadow); overflow:hidden; }
  .qlist{ display:flex; flex-direction:column; }
  .qrow{
    display:grid; grid-template-columns:104px 1.15fr 1.1fr 68px 1fr 1.5fr 168px;
    gap:14px; align-items:center; padding:15px 18px; border-top:1px solid var(--line);
  }
  .qrow:first-child{ border-top:none; }
  .qrow.head{ background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .qrow .id{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .qrow .who{ font-size:14px; }
  .qrow .who .sub{ font-size:12px; color:var(--ink-faint); }
  .qrow .age{ font-size:13px; color:var(--ink-soft); }
  .qrow .loc{ font-size:13.5px; font-weight:600; }
  .qrow .loc.warn{ color:var(--bad); }
  .qrow .status-cell .cap{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; line-height:1.35; }
  .qrow .actions{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .empty{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:14px; }

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;
    white-space:nowrap; border:1px solid transparent;
  }
  /* Status pills — Figma: 30px tall, r15, 12px semibold. Every pill carries an
     icon + a word so meaning never depends on color alone. */
  .pill{ min-height:26px; padding:4px 11px 4px 9px; }
  .pill svg{ width:13px; height:13px; flex:0 0 auto; }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.soft{ background:var(--soft); color:var(--brand); }            /* Routed */
  .pill.amber{ background:var(--current-soft); color:var(--current); } /* In progress / needs confirmation */
  .pill.good{ background:var(--good-soft); color:var(--good); border-color:color-mix(in srgb, var(--good) 35%, transparent); } /* Completed */
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .conf-chip{ display:inline-flex; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500; color:var(--ink-soft); background:var(--surface-2); border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:middle; }
  .conf-chip.low{ color:var(--current); background:var(--current-soft); }

  /* ---- Student list + detail (Figma 9:10, 9:57, 9:200, 9:240) ---- */
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; }
  .page-head .head-btn{ min-width:187px; min-height:46px; }
  .page-head .head-pill{ align-self:center; }
  .back-link{ background:none; border:none; padding:6px 0; margin-bottom:14px; font-size:13px; font-weight:600; color:var(--brand); min-height:36px; }
  .back-link:hover{ text-decoration:underline; text-underline-offset:3px; }
  .link-btn{ background:none; border:none; padding:6px 0; font-size:12.5px; color:var(--ink-soft); text-align:left; text-decoration:none; min-height:32px; display:inline-flex; align-items:center; gap:8px; }
  .link-btn:hover{ color:var(--brand); }
  .btn.block{ width:100%; min-height:46px; }

  .summary-band{ background:var(--soft); border-radius:var(--radius-band); padding:20px 24px; margin-bottom:28px; }
  .summary-band .big{ font-family:"Lora",serif; font-weight:600; font-size:22px; color:var(--brand); }
  .summary-band .sub{ font-size:14px; color:var(--ink-soft); margin-top:8px; }

  .req-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px 23px; }
  .req-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:17px 18px 12px; display:flex; flex-direction:column; gap:12px; }
  .req-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .req-card-title{ font-family:"Inter",sans-serif; font-size:17px; font-weight:600; margin:0; color:var(--ink); }
  .req-card-id{ font-size:12px; color:var(--ink-soft); margin-top:8px; }
  .req-card-where{ font-size:13px; font-weight:600; color:var(--brand); margin-top:10px; }
  .list-heading{ font-family:"Lora",serif; font-size:20px; margin:36px 0 14px; }

  .route-bar{ list-style:none; margin:0; padding:0; display:flex; gap:12px; }
  .route-bar .seg{ flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .route-bar .bar{ height:4px; border-radius:2px; background:var(--line); }
  .route-bar .lbl{ font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .route-bar .done .bar, .route-bar .current .bar{ background:var(--brand); }
  .route-bar .current .lbl, .route-bar .done .lbl{ color:var(--brand); font-weight:600; }
  .route-bar .done .lbl{ font-weight:500; }
  .route-bar .bad .bar{ background:var(--bad); } .route-bar .bad .lbl{ color:var(--bad); font-weight:600; }
  .route-bar.pending .lbl{ font-style:italic; }

  .empty-state{ text-align:center; padding:48px 24px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius-card); }
  .empty-state .empty-ic{ width:52px; height:52px; margin:0 auto 12px; border-radius:14px; background:var(--soft); color:var(--brand); display:flex; align-items:center; justify-content:center; }
  .empty-state .empty-ic svg{ width:26px; height:26px; }
  .empty-state h3{ margin:0 0 6px; font-size:19px; }
  .empty-state p{ margin:0 auto 18px; max-width:40ch; color:var(--ink-soft); font-size:14px; }

  .detail-grid{ display:grid; grid-template-columns:minmax(0,711fr) minmax(280px,365fr); gap:24px; align-items:start; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:24px 25px; }
  .panel-h{ font-size:23px; margin:0; }
  .panel-h.small{ font-size:20px; }
  .next-text{ font-size:15px; color:var(--ink-soft); margin:14px 0 30px; max-width:62ch; }
  .eyebrow-label{ font-size:12px; font-weight:600; color:var(--brand); letter-spacing:.03em; text-transform:uppercase; margin:56px 0 14px; }
  .form-row{ display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .form-thumb{ width:265px; height:205px; border-radius:11px; background:#F1F3F0; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--ink-soft); overflow:hidden; }
  .form-thumb .ph-ic{ font-size:50px; line-height:1; }
  .form-thumb .ph-txt{ font-size:14px; }
  .form-thumb.has-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-links{ display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
  .form-links .btn.secondary{ color:var(--brand); min-width:225px; min-height:46px; }
  .audit{ margin-top:30px; }
  .audit summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--brand); text-transform:uppercase; letter-spacing:.03em; min-height:32px; display:flex; align-items:center; gap:8px; list-style:none; }
  .audit summary::-webkit-details-marker{ display:none; }
  .audit summary::after{ content:"▾"; font-size:11px; transition:transform .15s; }
  .audit[open] summary::after{ transform:rotate(180deg); }
  .audit .timeline{ margin-top:14px; }
  .info-list{ margin:30px 0 0; display:flex; flex-direction:column; gap:22px; }
  .info-list div{ display:grid; grid-template-columns:115px 1fr; gap:10px; align-items:baseline; }
  .info-list dt{ font-size:12px; color:var(--ink-soft); }
  .info-list dd{ margin:0; font-size:13px; font-weight:600; color:var(--ink); overflow-wrap:anywhere; }
  .info-list dd.mono{ font-family:"Inter",sans-serif; }
  .qr-block{ margin-top:26px; padding-top:20px; border-top:1px solid var(--line); display:flex; gap:14px; align-items:center; scroll-margin-top:90px; }
  .qr-block #qrHolder{ background:#fff; padding:6px; border-radius:8px; border:1px solid var(--line); flex:0 0 auto; }
  .qr-block p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .m-detail-head{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-top:-8px; }
  .m-detail-head h2{ font-size:23px; }
  .m-detail-head .req-card-id{ margin:0; font-size:13px; }

  @media (max-width:1100px){
    .req-grid{ grid-template-columns:1fr; }
    .detail-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:680px){
    .mapp-body .back-link{ margin-bottom:0; align-self:flex-start; }
    .panel{ padding:20px 18px; }
    .mapp-body .panel-h{ font-size:12px; font-family:"Inter",sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--brand); }
    .mapp-body .panel-h.small{ font-size:18px; font-family:"Lora",serif; text-transform:none; letter-spacing:0; color:var(--ink); }
    .mapp-body .list-heading{ font-size:19px; margin:20px 0 4px; }
    .mapp-body .m-detail-head h2{ font-size:23px; }
    .next-text{ font-size:15px; font-weight:600; color:var(--ink); margin:12px 0 24px; }
    .eyebrow-label{ margin:28px 0 12px; }
    .form-row{ flex-wrap:nowrap; gap:16px; align-items:center; }
    .form-thumb{ width:104px; height:111px; flex:0 0 auto; }
    .form-thumb .ph-ic{ font-size:30px; } .form-thumb .ph-txt{ display:none; }
    .form-links .btn.secondary{ min-width:0; background:none; border:none; padding:6px 0; min-height:36px; font-size:13px; }
    .form-links .btn.secondary::after{ content:" →"; white-space:pre; }
    .form-links .link-btn{ font-size:13px; font-weight:600; color:var(--brand); }
    .summary-band{ padding:16px 18px; margin-bottom:18px; }
    .summary-band .big{ font-size:19px; }
  }

  /* ---- New request + AI result (Figma 9:91, 9:125, 9:148, 9:177) ---- */
  .nr-card, .result-card{ max-width:1000px; padding:34px 36px 28px; }
  .nr-sub{ margin:12px 0 0; color:var(--ink-soft); font-size:15px; }
  .nr-card .eyebrow-label{ display:block; margin:30px 0 12px; }
  .ro-stack{ display:flex; flex-direction:column; gap:12px; }
  .ro-field{ background:#F1F3F0; border-radius:var(--radius-btn); padding:14px 18px; display:flex; gap:14px; font-size:15px; color:var(--ink-soft); flex-wrap:wrap; }
  .ro-field .v{ color:var(--ink-soft); } .ro-field .sep{ color:var(--ink-faint); }
  .nr-card input[type=tel], .nr-card textarea, .mapp-body .field textarea, .mapp-body .field input{
    width:100%; padding:14px 18px; border-radius:var(--radius-btn); border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:16px;
  }
  .nr-card textarea{ min-height:166px; resize:vertical; }
  .nr-card input:focus, .nr-card textarea:focus, .dropzone:focus-within{ outline:2px solid var(--brand); outline-offset:2px; }
  .nr-two{ display:grid; grid-template-columns:1fr 1fr; gap:36px; }
  .nr-foot{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:24px; flex-wrap:wrap; }
  .nr-foot .btn{ min-width:300px; min-height:56px; font-size:17px; }
  .nr-hint{ margin:0; font-size:14px; color:var(--ink-soft); }
  .nr-hint.error{ color:var(--bad); font-weight:600; }
  .nr-hint.error::before{ content:"! "; }

  .dropzone{ display:flex; min-height:166px; border-radius:var(--radius-btn); background:var(--soft); border:1px solid var(--line); cursor:pointer; overflow:hidden; position:relative; }
  .dropzone:hover, .dropzone.drag{ border-color:var(--brand); }
  .dropzone.drag{ background:color-mix(in srgb, var(--soft) 70%, var(--brand) 12%); }
  .dz-empty{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:8px; padding:24px 44px; }
  .dz-title{ font-size:20px; font-weight:600; color:var(--brand); }
  .dz-sub{ font-size:13px; color:var(--ink-soft); }
  .dz-ic svg{ width:34px; height:34px; color:var(--brand); }
  .dz-preview{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px; }

  /* ---- Toasts ---- */
  .toasts{ position:fixed; z-index:80; right:24px; bottom:24px; display:flex; flex-direction:column; gap:10px; width:min(380px, calc(100vw - 32px)); pointer-events:none; }

/* =======================================================================
   DocuRoute — click-through prototype (desktop)
   Data Layer is Supabase (Postgres + Auth + Storage) — see supabase/schema.sql
   for the tables, RLS policies, and storage bucket. supabase-config.js holds
   the project URL/anon key and the shared `sb` client. This page is a pure
   client of that shared, multi-user, cloud-hosted state — no localStorage
   fallback for data (Supabase's own SDK caches the auth session there).
   Simulates the Section 3.10 pipeline: intake -> AI processing -> the
   70%-confidence gate -> deterministic routing table -> office action.
   ======================================================================= */

// Section 1.9's deterministic routing table (Dean's Office/Registrar/Treasury/Section Chief).
const ROUTES = {
  waiver:            ["Dean's Office","Registrar"],
  adjustment:        ["Section Chief","Registrar"],
  clearance:         ["Treasury","Dean's Office","Registrar"],
  // Real-world signers (Instructor/Adviser) aren't roles DocuRoute models --
  // Section Chief (the "Professor" account) is the closest existing stand-in
  // for faculty-level academic sign-off, same shape as Section Adjustment.
  course_completion: ["Section Chief","Registrar"],
  // Course-equivalency evaluation is a program/college-level decision, same
  // shape as Prerequisite Waiver.
  crediting:         ["Dean's Office","Registrar"],
  // Section 1.9's own definition: "subject to prescreening and acceptance by
  // the receiving program or Dean's Office."
  shift_program:     ["Dean's Office","Registrar"]
};
// A student submitting online never declares a type either — the AI
// Processing Layer is what's supposed to work that out, so declaring it up
// front via a dropdown would defeat the point. Only used as a last-resort
// guess inside finishPipeline() when the real classifier is unreachable —
// never at submission time, since a guess made there could never be
// corrected if the real classifier's response arrives too late or not at all.
function randomType(){
  const types = Object.keys(ROUTES);
  return types[Math.floor(Math.random() * types.length)];
}

// Local stand-in for the Section 3.10 AI Processing Layer (see ai-classifier/
// at the project root) -- only reachable while you're running its server on
// your own machine (`python serve.py`) and testing this page via file://.
// Once that service is hosted somewhere real (the planned Render backend),
// this becomes an https:// URL instead and no other code here needs to change.
//
// To point a phone at the desktop's classifier through a Cloudflare tunnel, open
// the page once as  .../index.html?classifier=https://xxxx.trycloudflare.com
// The address is remembered on that device; ?classifier=reset clears it.
const DEFAULT_CLASSIFIER_BASE = "http://127.0.0.1:5001";
const CLASSIFY_API_URL = (function(){
  try{
    const q = new URLSearchParams(location.search).get("classifier");
    if(q === "reset") localStorage.removeItem("docuroute.classifierBase");
    else if(q) localStorage.setItem("docuroute.classifierBase", q.replace(/\/+$/, "").replace(/\/classify$/, ""));
    return (localStorage.getItem("docuroute.classifierBase") || DEFAULT_CLASSIFIER_BASE) + "/classify";
  }catch(e){
    return DEFAULT_CLASSIFIER_BASE + "/classify";
  }
})();

// Returns {type, confidence} from the real classifier, or null if it's
// unreachable (server not running, CORS/mixed-content blocked, etc.) -- callers
// fall back to the old simulated confidence so the demo never breaks.
async function callClassifyApi({ file, text }){
  try{
    let res;
    if(file){
      const form = new FormData();
      form.append("file", file, file.name);
      res = await fetch(CLASSIFY_API_URL, { method:"POST", body: form });
    } else {
      res = await fetch(CLASSIFY_API_URL, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ text: text || "" })
      });
    }
    if(!res.ok) return null; // network/server error -- caller falls back to simulation
    const data = await res.json();
    if(typeof data.confidence !== "number") return null; // malformed response -- fall back
    // data.type may legitimately be null here: the real classifier explicitly
    // decided this isn't one of our 3 types (matched the "other" prototype, or
    // scored near-zero across the board). That's a real result, not a failure
    // -- it must NOT be treated the same as "server unreachable" below.
    return { type: data.type || null, confidence: data.confidence };
  }catch(e){
    return null; // offline/unreachable -- caller falls back to simulation
  }
}

// Portal access rules: a logged-in account only ever sees its own role's pages.
// A staff account is additionally scoped to exactly one office (profiles.office,
// enforced at the RLS level too — see supabase/schema.sql) instead of the old
// single shared "Staff" role that covered every office's queue at once.
const PAGES = {
  student: [ { id:"active",        label:"Active requests", short:"Requests", icon:"doc" },
             { id:"notifications", label:"Activity",        short:"Activity", icon:"bell" } ],
  admin:   [ { id:"overview",      label:"System Overview", short:"Overview", icon:"grid" },
             { id:"accounts",      label:"Account Management", short:"Accounts", icon:"users" } ]
};
const OFFICE_PAGES = {
  "Registrar":     { id:"registrar",    label:"Registrar Queue",      icon:"inbox" },
  "Treasury":      { id:"treasury",     label:"Treasury Queue",       icon:"wallet" },
  "Section Chief": { id:"sectionchief", label:"Section Chief Review", icon:"cap" },
  "Dean's Office": { id:"dean",         label:"Dean's Decision",      icon:"shield" }
};
const UNASSIGNED_PAGE = { id:"unassigned", label:"No Office Assigned", icon:"info" };
function pagesForSession(s){
  if(s.role === "staff") return [ (s.office && OFFICE_PAGES[s.office]) || UNASSIGNED_PAGE ];
  return PAGES[s.role];
}
const PORTAL_LABEL = { student:"Student Portal", admin:"Admin Portal" };
const OFFICE_PORTAL_LABEL = {
  "Registrar":"Registrar Portal", "Treasury":"Treasury Portal",
  "Section Chief":"Section Chief Portal", "Dean's Office":"Dean Portal"
};
function portalLabel(s){
  return s.role === "staff" ? (OFFICE_PORTAL_LABEL[s.office] || "Staff Portal") : PORTAL_LABEL[s.role];
}
const TYPE_LABEL = {
  waiver:"Prerequisite Waiver", adjustment:"Section Adjustment", clearance:"Student Clearance",
  course_completion:"Course Completion", crediting:"Transferee Crediting", shift_program:"Shift Program/Modality"
};
// A submitted-but-not-yet-classified request has type=null (see
// finishPipeline() / the requests.type migration) -- fall back to a label
// instead of rendering the literal string "undefined" during that window.
function typeLabel(t){ return TYPE_LABEL[t] || "Classifying…"; }
// Title for a request: its type once known; "Unidentified form" once the AI has
// finished without a type (waiting for the Registrar); "Classifying…" only while
// the AI is actually still running.
function reqTitle(r){
  if(r.type) return TYPE_LABEL[r.type] || r.type;
  return ["unverified","declined","completed"].includes(r.status) ? "Unidentified form" : "Classifying…";
}

let session = null; // {id, username, role, name, studentNo, program}
let state = { requests: [], accounts: [] };
let apiOnline = false;
let loginError = "";

async function loadSession(){
  const { data } = await sb.auth.getSession();
  if(!data.session){ session = null; return; }
  await hydrateProfile(data.session.user);
}

/* ---------------- Supabase data layer ---------------- */

class ApiError extends Error {}

async function hydrateProfile(user){
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !data){ session = null; return; }
  session = { id:user.id, email:data.email || user.email, role:data.role, office:data.office, name:data.name, studentNo:data.student_no, program:data.program };
}

function mapRequestRow(row){
  const logs = (row.request_logs || []).slice().sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  return {
    id: row.id, type: row.type, student: row.student_name, studentNo: row.student_no,
    program: row.program, contactNo: row.contact_no, fields: row.fields || {},
    confidence: row.confidence, route: row.route, hop: row.hop, status: row.status,
    documentPath: row.document_path, createdAt: row.created_at,
    log: logs.map(l => ({ ts: l.ts, text: l.text }))
  };
}

async function addLog(requestId, text){
  const { error } = await sb.from("request_logs").insert({ request_id: requestId, text });
  if(error) throw new ApiError(error.message);
}

async function refresh(){
  const { data, error } = await sb.from("requests").select("*, request_logs(ts,text)").order("created_at", { ascending:true });
  if(error) throw new ApiError(error.message);
  state.requests = data.map(mapRequestRow);
  apiOnline = true;
  recoverStuckSubmissions(); // fire-and-forget safety net -- see below
}

/* ---------------- Realtime sync across tabs/accounts ---------------- */
// Without this, one account's action (Section Chief consenting, Treasury
// clearing, etc.) is invisible to every other open tab until it manually
// reloads. Supabase Realtime broadcasts row changes on requests/request_logs
// to every subscriber whose own RLS policies would let them SELECT that row,
// so this only ever surfaces what that account could already see anyway --
// requires the two tables added to the `supabase_realtime` publication (see
// supabase/migration-004-realtime.sql).
let realtimeChannel = null;
let realtimeRefreshTimer = null;
function subscribeRealtime(){
  if(realtimeChannel || !sb) return;
  realtimeChannel = sb.channel("requests-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"requests" }, scheduleRealtimeRefresh)
    .on("postgres_changes", { event:"*", schema:"public", table:"request_logs" }, scheduleRealtimeRefresh)
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function scheduleRealtimeRefresh(){
  // Debounce: an insert plus its log rows arrive as several separate events
  // within milliseconds of each other -- collapse them into one refresh.
  clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer = setTimeout(syncNow, 250);
}
// True while redrawing the page would throw away something the user is in the
// middle of: a form being filled in, or the QR camera mid-scan. Background
// refreshes (live updates / polling) skip the redraw then; the data is still
// updated, and the next action or tab change shows it.
function userIsBusy(){
  const a = document.activeElement;
  if(a && a.closest("#root") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(session && session.role === "student" && state.newReq) return true;
  if(session && session.role === "staff" && isMobile()){
    if(mobileScreen === "capture") return true;
    if(mobileScreen === "scan" && scanResult === null) return true;
  }
  return false;
}

async function syncNow(){
  if(!session) return;
  try{
    await refresh();
    if(session.role === "admin") await refreshAccounts();
  }catch(e){ return; }
  if(userIsBusy()) return;
  renderRoot();
}

// Polling fallback: Realtime only delivers anything once both tables are
// added to the supabase_realtime publication (migration-004-realtime.sql)
// -- easy to forget, and silent (no error) if skipped, since the channel
// still connects, it just never receives events. Polling every 15s means
// cross-tab sync and the stuck-submission recovery sweep (both driven by
// refresh(), see below) still work on a plain existing project even if that
// migration hasn't been run, just less instantly than Realtime gives you.
// Safe to call while a modal is open: #overlay/#modal live outside #root,
// which is all renderRoot() touches.
let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(syncNow, 15000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

/* ---------------- Recovery: requests stuck at "AI Processing Layer" ---------------- */
// A student submission is inserted with status="submitted" (type=null,
// route=[]) *before* the AI pipeline runs; finishPipeline() is what resolves
// it. If the tab is closed or reloaded mid-pipeline, nothing is left to ever
// call finishPipeline again -- the row sits at "submitted" forever, and per
// the queue filters in queuePageHtml(), that status is invisible to every
// staff account (only the submitting student or an admin can even see a
// route=[] row under RLS). This sweep re-runs classification for any such
// row once it's clearly been abandoned, whenever a student or admin session
// refreshes -- the same two roles RLS already lets see the row at all.
const RECOVERY_STALE_MS = 8000; // well past the ~2.2s pipeline animation
const recoveryAttempted = new Set();
function recoverStuckSubmissions(){
  if(!session || (session.role !== "student" && session.role !== "admin")) return;
  state.requests
    .filter(r => r.status === "submitted" && !recoveryAttempted.has(r.id)
      && (Date.now() - new Date(r.createdAt).getTime()) > RECOVERY_STALE_MS)
    .forEach(r => { recoveryAttempted.add(r.id); recoverStuckSubmission(r); });
}
async function recoverStuckSubmission(r){
  try{
    if(r.type){
      // Staff-capture row: type/route were already set at insert, it just
      // never got a confidence assigned before the interruption.
      await finishPipeline(r.id, { skipClassification:true, silent:true });
      return;
    }
    let file = null;
    if(r.documentPath){
      const { data, error } = await sb.storage.from("documents").download(r.documentPath);
      if(!error && data) file = new File([data], r.documentPath.split("/").pop() || "document", { type: data.type || "application/octet-stream" });
    }
    const text = (r.fields && r.fields.details) || "";
    await finishPipeline(r.id, { file, text, silent:true });
  }catch(e){
    recoveryAttempted.delete(r.id); // let the next sweep retry
  }
}
async function refreshAccounts(){
  const { data, error } = await sb.from("profiles").select("*").order("name");
  if(error) throw new ApiError(error.message);
  state.accounts = data.map(a => ({ id:a.id, username:a.email, role:a.role, office:a.office, name:a.name, studentNo:a.student_no, program:a.program }));
  apiOnline = true;
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-PH",{month:"short",day:"numeric"}) + " · " +
         d.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"});
}
function fmtAge(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.max(1, Math.round(diffMs / 60000));
  if(mins < 60) return mins + " min" + (mins===1?"":"s");
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + " hr" + (hrs===1?"":"s");
  const days = Math.round(hrs/24);
  return days + " day" + (days===1?"":"s");
}

const SUPABASE_ANON_KEY = "eyJ...";</pre>
    <p>Then reload this page.</p>
  </div></div>`;
}

function renderRoot(){
  const root = document.getElementById("root");
  if(!SUPABASE_CONFIGURED){ root.innerHTML = configNeededHtml(); return; }
  if(isMobile()) return renderMobileRoot();
  if(!session){
    root.innerHTML = `<div class="login-shell"><div class="login-card" id="loginCard"></div></div>`;
    renderLogin();
    return;
  }
  root.innerHTML = `<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="content" id="view"></main></div>`;
  renderSidebar();
  const view = document.getElementById("view");
  if(!apiOnline){ view.innerHTML = offlineHtml(); wireOfflineRetry(); return; }
  view.innerHTML = renderPage();
  wireViewEvents();
  afterRender();
}

/* ---------------- Login ---------------- */

function renderLogin(){
  const card = document.getElementById("loginCard");
  card.innerHTML = `
    <div class="login-brand">${logoHtml("full", 44)}</div>
    ${loginError ? `<div class="login-error">${loginError}</div>` : ""}
    <div class="field"><label>School Email Address</label><input id="lUser" autocomplete="username" placeholder="you@mymail.mapua.edu.ph"></div>
    <div class="field"><label>Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn">Log In</button>
    <div class="demo-accounts">
      <b>Demo accounts</b>
      Student — apvsanpedro@mymail.mapua.edu.ph / aaron<br>
      Student — mefvocal@mymail.mapua.edu.ph / mike<br>
      Registrar — registrar@mymail.mapua.edu.ph / registrar<br>
      Treasury — treasury@mymail.mapua.edu.ph / treasury<br>
      Section Chief — prof@mymail.mapua.edu.ph / profff<br>
      Dean — dean@mymail.mapua.edu.ph / deanss<br>
      Admin — admin@mymail.mapua.edu.ph / admin
    </div>
  `;
  const submit = async ()=>{
    const email = document.getElementById("lUser").value.trim();
    const password = document.getElementById("lPass").value;
    try{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await hydrateProfile(data.user);
      if(!session) throw new Error("No profile found for this account — see supabase/schema.sql.");
      loginError = ""; apiOnline = true;
      await bootAfterLogin();
    }catch(e){
      loginError = e.message || "Could not reach Supabase.";
      renderLogin();
    }
  };
  document.getElementById("loginBtn").addEventListener("click", submit);
  card.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
  });
}

async function logout(){
  unsubscribeRealtime();
  stopPolling();
  session = null; // cleared first so the cross-tab login watcher treats this as our own logout
  await sb.auth.signOut();
  renderRoot();
}

async function bootAfterLogin(){
  state.page = pagesForSession(session)[0].id;
  subscribeRealtime();
  startPolling();
  try{
    await refresh();
    if(session.role === "admin") await refreshAccounts();
  }catch(e){ apiOnline = false; }
  renderRoot();
}

function renderSidebar(){
  const el = document.getElementById("sidebar");
  const pages = pagesForSession(session);
  const current = state.page || pages[0].id;
  el.innerHTML = `
    <div class="sidebar-brand">
      <img class="logo-img" src="assets/logo-full-light.png" alt="DocuRoute" width="190" height="36">
    </div>
    <div class="sidebar-sub">MAPÚA UNIVERSITY</div>
    <nav class="sidebar-nav" aria-label="Main">
      ${pages.map(p => `
        <button class="nav-item ${current===p.id?"active":""}" data-page="${p.id}" ${current===p.id?'aria-current="page"':""}>
          ${ICONS[p.icon]}<span>${p.label}</span>
        </button>
      `).join("")}
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="conn-row">
      <span class="conn-dot ${apiOnline?"":"off"}"></span>
      ${apiOnline ? "Connected" : "Offline — can't reach server"}
    </div>
    <button class="reset-link" id="logoutBtn">&#8592; log out</button>
    <div class="sidebar-foot">
      <div class="avatar">${session.name.charAt(0)}</div>
      <div class="who">
        <div class="name">${session.name}</div>
        <div class="portal">${portalLabel(session)}</div>
      </div>
    </div>
  `;
  el.querySelectorAll("[data-page]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.page = btn.dataset.page; resetStudentView(); renderRoot(); });
  });
  document.getElementById("logoutBtn").addEventListener("click", logout);
}

function renderPage(){
  const key = session.role + ":" + (state.page || pagesForSession(session)[0].id);
  if(key === "student:active") return studentActiveView();
  if(key === "student:notifications") return studentNotificationsView();
  if(key === "staff:registrar") return registrarQueueView();
  if(key === "staff:treasury") return treasuryQueueView();
  if(key === "staff:sectionchief") return sectionChiefView();
  if(key === "staff:dean") return deanDecidesView();
  if(key === "staff:unassigned") return unassignedOfficeView();
  if(key === "admin:overview") return adminOverviewView();
  if(key === "admin:accounts") return accountManagementView();
  return `<div class="content-body"><div class="empty">Unknown page.</div></div>`;
}

function offlineHtml(){
  return `
    <div class="content-header">
      <h1>Can't reach Supabase</h1>
      <p>This prototype's data (and accounts) now live in a shared Supabase project instead of a local server.</p>

function wireMobileScan(){
  // Showing a result: wire its buttons and leave the camera OFF.
  if(scanResult !== null){
    document.querySelectorAll("[data-scan-again]").forEach(b => b.addEventListener("click", ()=>{ scanResult = null; renderRoot(); }));
    document.querySelectorAll("[data-mconfirm]").forEach(b => b.addEventListener("click", () => confirmAndRoute(b.dataset.mconfirm)));
    document.querySelectorAll("[data-madvance]").forEach(b => b.addEventListener("click", () => advanceRequest(b.dataset.madvance)));
    document.querySelectorAll("[data-mview]").forEach(b => b.addEventListener("click", () => openDetail(b.dataset.mview)));
    return;
  }
  document.getElementById("manualQrBtn").addEventListener("click", ()=>{
    const v = document.getElementById("manualQrInput").value.trim();
    if(v) handleQrDecoded(v);
  });
  document.getElementById("manualQrInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ const v = e.target.value.trim(); if(v) handleQrDecoded(v); }
  });
  startQrScanner();
}

async function startQrScanner(){
  const video = document.getElementById("qrVideo");
  const viewfinder = document.getElementById("mappViewfinder");
  if(!video || !viewfinder) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    viewfinder.innerHTML = `<div class="cam-error">Camera access needs a secure (HTTPS) context — this works once deployed to Vercel. Use the tracking ID field below for now.</div>`;
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    qrStreamHandle = stream;
    video.srcObject = stream;
    await video.play();
    const canvas = document.getElementById("qrCanvas");
    const ctx = canvas.getContext("2d");
    const tick = ()=>{
      if(mobileScreen !== "scan" || !qrStreamHandle) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = (typeof jsQR === "function") ? jsQR(imageData.data, imageData.width, imageData.height) : null;
        if(code && code.data){ stopQrScanner(); handleQrDecoded(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }catch(e){
    viewfinder.innerHTML = `<div class="cam-error">Couldn't access the camera (${e.message}). Use the tracking ID field below instead.</div>`;
  }
}
function stopQrScanner(){
  const video = document.getElementById("qrVideo");
  if(video){ try{ video.pause(); }catch(e){} video.srcObject = null; }
  if(qrStreamHandle){ qrStreamHandle.getTracks().forEach(t=>t.stop()); qrStreamHandle = null; }
}

// Re-renders the screen with the result card (and no camera) — see scanResult above.
function handleQrDecoded(text){
  stopQrScanner();
  scanResult = String(text).trim();
  renderRoot();
}

/* ---------------- Status helpers ---------------- */

// One status vocabulary (#12): plain words for students, operational words for
// staff/admin. Tone picks the pill color; the icon keeps meaning visible
// without color. "Unverified" is amber, not red — it's the normal path for
// most real photos (only ~11% clear 70%), not an error.
const STATUS_ICON = {
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  spark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>`,
  eye:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  dots:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  x:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17h.01"/></svg>`,
  info:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`
};
const STATUS = {
  submitted:  { tone:"neutral", icon:"clock", student:"Submitted",              staff:"Submitted" },
  review:     { tone:"neutral", icon:"spark", student:"Reading your form",      staff:"AI processing" },
  unverified: { tone:"amber",   icon:"eye",   student:"Registrar will confirm", staff:"Needs confirmation" },
  routed:     { tone:"soft",    icon:"arrow", student:"Routed",                 staff:"Routed" },
  progress:   { tone:"amber",   icon:"dots",  student:"In progress",            staff:"In progress" },
  completed:  { tone:"good",    icon:"check", student:"Completed",              staff:"Completed" },
  approved:   { tone:"good",    icon:"check", student:"Approved",               staff:"Approved" },
  declined:   { tone:"bad",     icon:"x",     student:"Declined",               staff:"Declined" }
};
function isStudentView(){ return !session || session.role === "student"; }
function statusLabel(status){
  const s = STATUS[status];
  return s ? (isStudentView() ? s.student : s.staff) : status;
}
function pill(status){
  const s = STATUS[status] || { tone:"neutral", icon:"clock" };
  return `<span class="pill ${s.tone}">${STATUS_ICON[s.icon]}${statusLabel(status)}</span>`;
}
// Staff see the AI's confidence beside the status; students don't (their AI
// result is explained in words on the result screen instead).
function confPill(r){
  const showConf = !isStudentView() && r.confidence !== null && ["unverified","routed","progress"].includes(r.status);
  return pill(r.status) + (showConf ? `<span class="conf-chip ${r.confidence < 70 ? "low" : ""}" title="AI confidence">${r.confidence}%</span>` : "");
}
function statusCaption(r){
  const student = isStudentView();
  if(r.status==="unverified") return student
    ? "The AI wasn't sure which form this is, so the Registrar will confirm it."
    : "Below the 70% confidence gate — confirm the type to route it.";
  if(r.status==="declined"){ const last=r.log[r.log.length-1]; return last ? esc(last.text) : ""; }
  if(r.status==="completed") return "All offices cleared — audit trail closed.";
  if(r.status==="submitted" || r.status==="review") return student ? "Reading your form…" : "Waiting for the AI Processing Layer.";
  const prevIdx = r.hop - 1;
  return prevIdx>=0 ? `${r.route[prevIdx]} → ${r.route[r.hop]}` : `Awaiting action at ${r.route[r.hop]}`;
}
function currentOfficeLabel(req){
  if(req.status==="submitted" || req.status==="review") return "AI Processing Layer";
  if(req.status==="unverified") return "Registrar review";
  if(req.status==="completed" || req.status==="declined") return "Closed";
  return req.route[req.hop];
}

/* ---------------- Toasts + confirm dialog (replace alert/confirm/prompt) ---------------- */

const TOAST_ICON = { info:"info", good:"check", warn:"alert", bad:"alert" };
function showToast(message, tone, opts){
  tone = tone || "info"; opts = opts || {};
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = `toast ${tone}`;
  el.setAttribute("role", tone === "bad" ? "alert" : "status");
  el.innerHTML = `${STATUS_ICON[TOAST_ICON[tone]]}<div class="msg"></div><button class="x" aria-label="Dismiss">&times;</button>`;
  el.querySelector(".msg").textContent = message;
  const close = ()=>{ el.remove(); };
  el.querySelector(".x").addEventListener("click", close);
  wrap.appendChild(el);
  const ms = opts.timeout ?? (tone === "bad" ? 8000 : 4500);
  if(ms) setTimeout(close, ms);
}

// Promise-based confirm. With `reason`, shows a textarea that must be filled.
// Resolves { ok:boolean, reason:string }.
function confirmDialog({ title, body, confirmLabel, danger, reason, select }){
  return new Promise(resolve=>{
    const layer = document.getElementById("dialogOverlay");
    const box = document.getElementById("dialog");
    box.innerHTML = `
      <div class="modal-head"><h2 id="dialogTitle">${title}</h2></div>
      <div class="modal-body">
        ${body ? `<p>${body}</p>` : ""}
        ${select ? `<div class="field"><label for="dlgSelect">${select.label}</label>
          <select id="dlgSelect">${select.options.map(o => `<option value="${o.value}" ${o.value === select.value ? "selected" : ""}>${o.label}</option>`).join("")}</select>
          ${select.note ? `<div class="hint-soft">${select.note}</div>` : ""}</div>` : ""}
        ${reason ? `<div class="field"><label for="dlgReason">${reason.label}</label>
          <textarea id="dlgReason" placeholder="${reason.placeholder || ""}"></textarea>
          <div class="hint-error" id="dlgReasonErr" hidden>Please give a reason — the student will see it.</div></div>` : ""}
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="dlgCancel">Cancel</button>
        <button class="btn ${danger ? "danger" : ""}" id="dlgOk">${confirmLabel || "Confirm"}</button>
      </div>`;
    layer.classList.add("open");
    const finish = (ok)=>{
      const text = reason ? document.getElementById("dlgReason").value.trim() : "";
      if(ok && reason && !text){ document.getElementById("dlgReasonErr").hidden = false; document.getElementById("dlgReason").focus(); return; }
      const picked = select ? document.getElementById("dlgSelect").value : null;
      layer.classList.remove("open"); box.innerHTML = "";
      document.removeEventListener("keydown", onKey);
      resolve({ ok, reason:text, value:picked });
    };
    const onKey = (e)=>{ if(e.key === "Escape") finish(false); };
    document.addEventListener("keydown", onKey);
    document.getElementById("dlgCancel").addEventListener("click", ()=>finish(false));
    document.getElementById("dlgOk").addEventListener("click", ()=>finish(true));
    layer.onclick = (e)=>{ if(e.target === layer) finish(false); };
    (reason ? document.getElementById("dlgReason") : select ? document.getElementById("dlgSelect") : document.getElementById("dlgOk")).focus();
  });
}

function stepDotClass(i, route, hop, status){
  if(status==="completed") return "done";
  if(status==="declined") return i<hop ? "done" : (i===hop ? "bad" : "");
  if(i<hop) return "done";
  if(i===hop) return "current";
  return "";
}
function stepperHtml(route, hop, status){
  return `<div class="stepper">${route.map((loc,i)=>`
      <div class="step-node">
        <div class="step-dot ${stepDotClass(i,route,hop,status)}"></div>
        <div class="step-label">${loc}</div>
      </div>
      ${i<route.length-1 ? `<div class="step-line ${i<hop?"done":""}"></div>` : ""}
    `).join("")}</div>`;
}

}
const isClosed = r => r.status === "completed" || r.status === "declined";

// Segmented route bar: one segment per office, forest = cleared/current,
// grey = still ahead. Labels carry ●/○ plus the word, not color alone.
function routeBarHtml(req){
  if(!req.route || !req.route.length){
    return `<div class="route-bar pending"><div class="seg"><span class="bar"></span><span class="lbl">Office decided after confirmation</span></div></div>`;
  }
  return `<ol class="route-bar" aria-label="Route">${req.route.map((office, i)=>{
    let st = "todo";
    if(req.status === "completed" || i < req.hop) st = "done";
    else if(i === req.hop && ["routed","progress"].includes(req.status)) st = "current";
    else if(i === req.hop && req.status === "declined") st = "bad";
    const word = { done:"cleared", current:"current step", bad:"declined here", todo:"upcoming" }[st];
    return `<li class="seg ${st}"><span class="bar"></span><span class="lbl">${st === "todo" ? "○" : "●"}&nbsp; ${office}<span class="sr-only"> — ${word}</span></span></li>`;
  }).join("")}</ol>`;
}

function declineReason(r){
  const hit = [...r.log].reverse().find(l => /declined the request/.test(l.text));
  const m = hit && hit.text.match(/reason: '([\s\S]*)'\.?$/);
  return m ? m[1] : "";
}

// Plain-language "what happens next" line for the student.
function nextStepText(r){
  const cur = r.route[r.hop], next = r.route[r.hop + 1];
  switch(r.status){
    case "submitted": case "review": return "We're reading your form. This only takes a few seconds.";
    case "unverified": return "The AI wasn't sure which form this is, so the Registrar will confirm it. Once confirmed, it's sent on automatically.";
    case "routed": return `Your form is with ${cur}.` + (next ? ` ${next} is next.` : " This is the last office.");
    case "progress": return `${cur} is reviewing your form.` + (next ? ` ${next} is next.` : " This is the last office.");
    case "completed": return "Every office has cleared your request. You're done.";
    case "declined": { const why = declineReason(r); return `${cur} declined this request.` + (why ? ` Reason: ${why}` : ""); }
    default: return "";
  }
}

// Runs after every render: fills the QR code and the form thumbnail on the
// student detail page (the thumbnail needs a short-lived signed URL).
function afterRender(){
  document.querySelectorAll("[data-new-req]").forEach(b => b.addEventListener("click", openNewRequestModal));
  document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", ()=>{ resetStudentView(); renderRoot(); }));
  wireNewRequestForm();
  if(!state.detailId || !session || session.role !== "student") return;
  const r = myRequests().find(x => x.id === state.detailId);
  if(!r) return;
  const qr = document.getElementById("qrHolder");
  if(qr){ try{ new QRCode(qr, { text:r.id, width:96, height:96, colorDark:"#19261E", colorLight:"#ffffff" }); }catch(e){ qr.textContent = r.id; } }
  const viewBtn = document.getElementById("viewDocBtn");
  if(viewBtn) viewBtn.addEventListener("click", ()=>openSignedDoc(r.documentPath));
  const thumb = document.getElementById("formThumb");
  if(thumb && r.documentPath && /\.(jpe?g|png|webp|gif)$/i.test(r.documentPath)){
    sb.storage.from("documents").createSignedUrl(r.documentPath, 300).then(({ data })=>{
      if(!data || !data.signedUrl || !document.body.contains(thumb)) return;
      const img = new Image();
      img.alt = "Photo of your submitted form";
      img.onload = ()=>{ thumb.innerHTML = ""; thumb.appendChild(img); thumb.classList.add("has-img"); };
      img.src = data.signedUrl;
    });
  }
}

async function openSignedDoc(path){
  const { data, error } = await sb.storage.from("documents").createSignedUrl(path, 60);
  if(!error && data && data.signedUrl) window.open(data.signedUrl, "_blank");
  else showToast("Couldn't open the attached form. Try again in a moment.", "bad");
}

async function applySeedPlan(id, type, confidence, plan){
  await addLog(id, "AI Processing Layer: image rectified, OCR extracted, layout-aware classification run.");
  const route = ROUTES[type];
  if(confidence < 70){
    await addLog(id, `Confidence ${confidence}% is below the 70% threshold - flagged 'Unverified' and sent to the intake clerk queue.`);
    await must(`update ${id}`, sb.from("requests").update({ confidence, status:"unverified" }).eq("id", id));
    if(plan === "unverified") return;
  } else {
    await addLog(id, `Confidence ${confidence}% - deterministic routing table assigned this request. QR sticker printed, digital twin archived.`);
    await must(`update ${id}`, sb.from("requests").update({ confidence, status:"routed" }).eq("id", id));
    if(plan === "routed") return;
  }
  let hop = 0;
  if(plan === "progress" || plan === "completed"){
    await addLog(id, `${route[hop]} marked the request In Progress.`);
    await must(`update ${id}`, sb.from("requests").update({ status:"progress" }).eq("id", id));
    if(plan === "progress") return;
  }
  if(plan === "completed"){
    while(hop < route.length - 1){
      await addLog(id, `${route[hop]} cleared the request - forwarded to ${route[hop+1]}.`);
      hop++;
    }
    await addLog(id, `${route[hop]} gave final approval. Request closed.`);
    await must(`update ${id}`, sb.from("requests").update({ status:"completed", hop }).eq("id", id));
  }
}

// Runs one reset step; a failed write stops the whole reset with a message that
// says which step failed (these used to be ignored, so a failure surfaced
// later as a confusing row-level-security error on the audit log).
async function must(step, query){
  const { data, error } = await query;
  if(error) throw new Error(`${step}: ${error.message}`);
  return data;
}

async function resetDemoRequests(){
  // The login is shared by every tab of this browser. If someone signed in as a
  // different account in another tab, our writes would silently run as THAT
  // account — so confirm we're still the admin before touching anything.
  const { data: u } = await sb.auth.getUser();
  if(!u || !u.user || u.user.id !== session.id){
    throw new Error("You're signed in as a different account in another tab. Log out here and log in as the admin again.");
  }
  await must("restart ID counter", sb.rpc("reset_request_seq"));
  await must("clear old requests", sb.from("requests").delete().neq("id", ""));
  const profiles = await must("load accounts", sb.from("profiles").select("id,name,student_no,program"));
  const byName = n => (profiles || []).find(p => p.name === n);
  const seeds = [
    { type:"waiver",     name:"Aaron Peter San Pedro", fields:{ quarterAY:"1Q, AY 2026-2027", prereq:"IT101", advanced:"IT201" }, confidence:92, plan:"routed" },
    { type:"adjustment", name:"Mike Emil F. Vocal",     fields:{ currentSection:"IT41FA1", newSection:"IT41FA2", subject:"IT201" }, confidence:88, plan:"completed" },
    { type:"clearance",  name:"Bea Villanueva",         fields:{ reason:"Transferring to another program" }, confidence:61, plan:"unverified" },
    { type:"waiver",     name:"Carlo Dizon",            fields:{ quarterAY:"1Q, AY 2026-2027", prereq:"CS201", advanced:"CS301" }, confidence:95, plan:"progress" }
  ];
  for(const s of seeds){
    const p = byName(s.name);
    const id = await must("new request ID", sb.rpc("next_request_id"));
    await must(`create demo request ${id}`, sb.from("requests").insert({
      id, type: s.type, student_id: p ? p.id : null, student_name: s.name,
      student_no: p ? p.student_no : "—", program: p ? p.program : "—",
      contact_no: "09171234567", fields: s.fields, confidence: null, route: ROUTES[s.type], hop: 0, status: "submitted"
    }));
    await addLog(id, `Submitted by ${s.name} at the Registrar window.`);
    await applySeedPlan(id, s.type, s.confidence, s.plan);
  }
}

function wireNewRequestForm(){
  const input = document.getElementById("fFile");
  if(!input || !document.getElementById("submitReqBtn")) return;
  const zone = document.getElementById("dropzone");
  const showFile = (file)=>{
    const img = document.getElementById("dzImg");
    zone.querySelector(".dz-empty").hidden = !!file;
    zone.querySelector(".dz-preview").hidden = !file;
    zone.classList.toggle("filled", !!file);
    if(!file) return;
    document.getElementById("dzFile").textContent = file.name;
    if(file.type.startsWith("image/")){ img.src = URL.createObjectURL(file); img.hidden = false; }
    else { img.hidden = true; img.removeAttribute("src"); }
    clearHintError();
  };
  input.addEventListener("change", ()=> showFile(input.files[0]));
  // Desktop drag-and-drop onto the same zone.
  ["dragenter","dragover"].forEach(ev => zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev => zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.remove("drag"); }));
  zone.addEventListener("drop", e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f) return;
    const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files; showFile(f);
  });
  document.getElementById("tDetails").addEventListener("input", clearHintError);
  document.getElementById("submitReqBtn").addEventListener("click", ()=>{
    rememberContact(document.getElementById("fContact").value.trim());
    handleSubmitRequest();
  });
}
